name: Application Management Production Catalog Sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  sync-managed-catalog:
    if: ${{ github.actor == 'BlueDragon33' && github.event.issue.number == 137 && github.event.comment.body == '/sync-managed-catalog-production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize Production D1 config
        run: npm run cloudflare:production:prepare

      - name: Create short-lived owner QA session
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import crypto from "node:crypto";
          const token = crypto.randomBytes(32).toString("base64url");
          const hash = crypto.createHash("sha256").update(token).digest("base64url");
          console.log(`QA_SESSION_TOKEN=${token}`);
          console.log(`QA_SESSION_HASH=${hash}`);
          NODE
          source "$GITHUB_ENV"
          NOW="$(date +%s)"
          EXPIRES="$((NOW + 900))"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command             "INSERT INTO control_sessions (session_id_hash,email,expires_at,created_at,last_seen_at)
             SELECT '$QA_SESSION_HASH', email, $EXPIRES, $NOW, $NOW
             FROM control_accounts
             WHERE role='owner' AND status='active'
             ORDER BY created_at ASC LIMIT 1;"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command             "SELECT COUNT(*) AS qa_session_count FROM control_sessions WHERE session_id_hash='$QA_SESSION_HASH';"

      - name: Sync existing managed apps into Dynamic Catalog
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/catalog-sync.json --write-out '%{http_code}' --max-time 60             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/json"             -H "Cookie: __Host-am_prod_session=$QA_SESSION_TOKEN"             --data '{"action":"sync-existing"}'             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Dynamic Catalog sync failed with HTTP $CODE."
            cat /tmp/catalog-sync.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/catalog-sync.json", "utf8"));
          if (!value.ok) throw new Error(value.error || "Catalog sync did not return ok.");
          console.log("CATALOG_SYNC_TOTALS=" + JSON.stringify(value.totals ?? {}));
          for (const item of value.migrated ?? []) {
            console.log(`MIGRATED ${item.id} source=${item.source ?? "unknown"} connection=${item.probe?.connection ?? "none"} remoteAdminReady=${Boolean(item.probe?.remoteAdminReady)}`);
          }
          for (const item of value.needsOrigin ?? []) {
            console.log(`NEEDS_ORIGIN ${item.id} :: ${item.reason}`);
          }
          NODE

      - name: Re-probe every enabled Dynamic Contract
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/catalog-probe.json --write-out '%{http_code}' --max-time 90             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/json"             -H "Cookie: __Host-am_prod_session=$QA_SESSION_TOKEN"             --data '{"action":"probe-all"}'             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Dynamic Catalog probe-all failed with HTTP $CODE."
            cat /tmp/catalog-probe.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/catalog-probe.json", "utf8"));
          if (!value.ok) throw new Error(value.error || "Catalog probe-all did not return ok.");
          console.log("CATALOG_PROBE_TOTALS=" + JSON.stringify(value.totals ?? {}));
          for (const item of value.probes ?? []) {
            console.log(`PROBE ${item.id} connection=${item.connection} credential=${Boolean(item.credentialConfigured)} remoteAdminReady=${Boolean(item.remoteAdminReady)} protocol=${item.protocol ?? "none"} via=${item.discoveredVia ?? "none"} note=${String(item.note ?? "").replace(/\\s+/g, " ").slice(0, 700)}`);
          }
          NODE

      - name: Upload sanitized catalog sync results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-management-production-catalog-sync
          path: |
            /tmp/catalog-sync.json
            /tmp/catalog-probe.json
          if-no-files-found: warn
          retention-days: 3

      - name: Delete short-lived QA session
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${QA_SESSION_HASH:-}" ]]; then
            npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command               "DELETE FROM control_sessions WHERE session_id_hash='$QA_SESSION_HASH';"
          fi
