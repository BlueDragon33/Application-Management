name: Client Device UI Semantics Migration v2

on:
  push:
    branches: [fix/client-device-ui-semantics]
    paths: [.github/workflows/client-device-ui-fix-v2.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-device-ui-semantics
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Run corrected bounded migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/client-device-ui-fix.yml').read_text()
          start = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          script = script.replace("manage_block = '''", "manage_block = r'''", 1)
          exec(compile(script, '<client-device-ui-migration>', 'exec'))
          PY

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and contract tests
        run: npm test

      - name: Commit verified migration and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/client-device-ui-fix.yml .github/workflows/client-device-ui-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden client-device UI semantics"
          git push origin HEAD:fix/client-device-ui-semantics
