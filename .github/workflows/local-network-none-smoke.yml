name: Application Management Network-None Local Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/local-isolated-network-none-smoke.mjs'
      - '.github/workflows/local-network-none-smoke.yml'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Install dependencies before isolation
        run: npm ci --no-audit --no-fund
      - name: Pull runner image while downloads are still permitted
        run: docker pull node:22-bookworm-slim
      - name: Start real local app with no external network
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --memory 3g \
            --cpus 2 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e OFFLINE_NETWORK_ISOLATED=1 \
            -e CI=1 \
            node:22-bookworm-slim \
            node scripts/local-isolated-network-none-smoke.mjs
      - name: Accurate evidence scope
        run: echo "LOCAL HOME SMOKE only: no cross-app connection, record roundtrip or product acceptance is asserted."
