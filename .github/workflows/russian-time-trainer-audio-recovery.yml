name: Russian Time Trainer audio recovery candidates
on:
  pull_request:
    paths:
      - 'scripts/russian-time-trainer-audio-recovery.py'
      - '.github/workflows/russian-time-trainer-audio-recovery.yml'
permissions:
  contents: read
jobs:
  audio-recovery:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.number == 423 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated QA-only offline synthesis and encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m venv "$RUNNER_TEMP/rtt-audio-venv"
          "$RUNNER_TEMP/rtt-audio-venv/bin/pip" install --disable-pip-version-check "piper-tts==1.3.0"
      - name: Acquire documented human clips then compare offline synthesis
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          "$RUNNER_TEMP/rtt-audio-venv/bin/python" scripts/russian-time-trainer-audio-recovery.py "$RUNNER_TEMP/rtt-audio-recovery" "$RUNNER_TEMP/rtt-audio-model"
      - name: Upload review-only candidates and provenance (including partial evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-time-trainer-audio-recovery
          path: ${{ runner.temp }}/rtt-audio-recovery/
          retention-days: 7
          if-no-files-found: error
