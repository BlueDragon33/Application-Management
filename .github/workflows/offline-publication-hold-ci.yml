name: Offline Publication Hold CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-development-deploy.yml'
      - '.github/workflows/bootstrap-managed-client-production.yml'
      - '.github/workflows/deploy-application-management-production.yml'
      - 'tests/governance/offline-publication-hold.test.mjs'
      - '.github/workflows/offline-publication-hold-ci.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-development-deploy.yml'
      - '.github/workflows/bootstrap-managed-client-production.yml'
      - '.github/workflows/deploy-application-management-production.yml'
      - 'tests/governance/offline-publication-hold.test.mjs'
      - '.github/workflows/offline-publication-hold-ci.yml'

permissions:
  contents: read

jobs:
  verify-offline-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node --test tests/governance/offline-publication-hold.test.mjs
