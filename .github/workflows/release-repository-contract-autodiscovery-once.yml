name: One-shot repository contract Production release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-repository-contract-autodiscovery-once.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: one-shot-repository-contract-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.actor == 'BlueDragon33' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: application-management-production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Dispatch canonical Production deployment
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-application-management-production.yml --ref main -f confirm=DEPLOY_PRODUCTION
          RUN_ID=""
          for attempt in {1..18}; do
            gh run list --workflow deploy-application-management-production.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt > /tmp/deploy-runs.json
            RUN_ID="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const runs = JSON.parse(fs.readFileSync("/tmp/deploy-runs.json", "utf8"));
          const current = runs.find((run) => run.headSha === process.env.GITHUB_SHA);
          if (current) process.stdout.write(String(current.databaseId));
          NODE
            )"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            echo "Waiting for canonical Production deploy run ($attempt/18)..."
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Could not resolve the workflow_dispatch Production deployment for $GITHUB_SHA."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Watching Production deployment run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize Production D1 config
        run: npm run cloudflare:production:prepare

      - name: Create short-lived owner QA session
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import crypto from "node:crypto";
          const token = crypto.randomBytes(32).toString("base64url");
          const hash = crypto.createHash("sha256").update(token).digest("base64url");
          console.log(`QA_SESSION_TOKEN=${token}`);
          console.log(`QA_SESSION_HASH=${hash}`);
          NODE
          source "$GITHUB_ENV"
          NOW="$(date +%s)"
          EXPIRES="$((NOW + 900))"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command \
            "INSERT INTO control_sessions (session_id_hash,email,expires_at,created_at,last_seen_at)
             SELECT '$QA_SESSION_HASH', email, $EXPIRES, $NOW, $NOW
             FROM control_accounts
             WHERE role='owner' AND status='active'
             ORDER BY created_at ASC LIMIT 1;"
          COUNT="$(npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --json --command \
            "SELECT COUNT(*) AS count FROM control_sessions WHERE session_id_hash='$QA_SESSION_HASH';" | node --input-type=module -e '
              let raw=""; for await (const chunk of process.stdin) raw += chunk;
              const data=JSON.parse(raw); const rows=data?.[0]?.results ?? data?.[0]?.result ?? [];
              process.stdout.write(String(rows?.[0]?.count ?? 0));
            ')"
          if [[ "$COUNT" != "1" ]]; then
            echo "::error::Could not create the short-lived Production QA session."
            exit 1
          fi

      - name: Sync repository-discovered contracts into Dynamic Catalog
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/catalog-sync.json --write-out '%{http_code}' --max-time 90 \
            -X POST \
            -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/json" \
            -H "Cookie: __Host-am_prod_session=$QA_SESSION_TOKEN" \
            --data '{"action":"sync-existing"}' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Dynamic Catalog sync failed with HTTP $CODE."
            cat /tmp/catalog-sync.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/catalog-sync.json", "utf8"));
          if (!value.ok) throw new Error(value.error || "Catalog sync did not return ok.");
          console.log("CATALOG_SYNC_TOTALS=" + JSON.stringify(value.totals ?? {}));
          for (const item of value.migrated ?? []) {
            console.log(`MIGRATED ${item.id} source=${item.source ?? "unknown"} connection=${item.probe?.connection ?? "none"} contractConnected=${Boolean(item.probe?.contractConnected)} remoteAdminReady=${Boolean(item.probe?.remoteAdminReady)}`);
          }
          for (const item of value.existing ?? []) {
            console.log(`EXISTING ${item.id} source=${item.source ?? "existing"} connection=${item.probe?.connection ?? "none"} contractConnected=${Boolean(item.probe?.contractConnected)} remoteAdminReady=${Boolean(item.probe?.remoteAdminReady)}`);
          }
          for (const item of value.needsOrigin ?? []) {
            console.log(`NEEDS_ORIGIN ${item.id} :: ${item.reason}`);
          }
          NODE

      - name: Re-probe every enabled Dynamic Contract
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/catalog-probe.json --write-out '%{http_code}' --max-time 120 \
            -X POST \
            -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/json" \
            -H "Cookie: __Host-am_prod_session=$QA_SESSION_TOKEN" \
            --data '{"action":"probe-all"}' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Dynamic Catalog probe-all failed with HTTP $CODE."
            cat /tmp/catalog-probe.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/catalog-probe.json", "utf8"));
          if (!value.ok) throw new Error(value.error || "Catalog probe-all did not return ok.");
          console.log("CATALOG_PROBE_TOTALS=" + JSON.stringify(value.totals ?? {}));
          for (const item of value.probes ?? []) {
            console.log(`PROBE ${item.id} connection=${item.connection} contractConnected=${Boolean(item.contractConnected)} credential=${Boolean(item.credentialConfigured)} remoteAdminReady=${Boolean(item.remoteAdminReady)} protocol=${item.protocol ?? "none"} via=${item.discoveredVia ?? "none"} note=${String(item.note ?? "").replace(/\\s+/g, " ").slice(0, 700)}`);
          }
          NODE

      - name: Upload sanitized Production reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-contract-production-reconciliation
          path: |
            /tmp/catalog-sync.json
            /tmp/catalog-probe.json
          if-no-files-found: warn
          retention-days: 3

      - name: Delete short-lived QA session
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${QA_SESSION_HASH:-}" ]]; then
            npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command \
              "DELETE FROM control_sessions WHERE session_id_hash='$QA_SESSION_HASH';"
          fi
