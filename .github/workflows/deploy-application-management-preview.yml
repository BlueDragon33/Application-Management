name: Application Management Cloudflare Preview Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-management-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: application-management-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PREVIEW_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PREVIEW_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PREVIEW_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PREVIEW_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PREVIEW_ORIGIN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Require preview deployment basics
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required."; exit 1; }
          done

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package preview
        run: npm run cloudflare:preview:prepare

      - name: Apply preview migrations
        run: npx wrangler d1 migrations apply application-management-preview-db --remote --config wrangler.cloudflare.jsonc

      - name: Build preview
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.jsonc
        run: npm run build

      - name: Deploy preview
        run: npx wrangler deploy --config wrangler.cloudflare.jsonc

      - name: Quick availability check
        if: ${{ env.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$APPLICATION_MANAGEMENT_PREVIEW_ORIGIN/" || true)"
            case "$code" in 200|301|302|303|307|308|401|403) echo "Preview reachable: HTTP $code"; exit 0 ;; esac
            sleep 2
          done
          echo "::error::Preview did not become reachable."
          exit 1
