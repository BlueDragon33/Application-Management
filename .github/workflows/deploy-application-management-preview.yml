name: Application Management Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PREVIEW để triển khai Application Management vào Cloudflare preview riêng"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: application-management-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: application-management-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PREVIEW_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PREVIEW_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PREVIEW_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PREVIEW_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PREVIEW_ORIGIN }}
      CONTROL_SERVICE_SECRET: ${{ secrets.CONTROL_SERVICE_SECRET }}
      HEALTH_CONTROL_SERVICE_SECRET: ${{ secrets.HEALTH_CONTROL_SERVICE_SECRET }}
      RU_LIFE_CONTROL_SERVICE_SECRET: ${{ secrets.RU_LIFE_CONTROL_SERVICE_SECRET }}
      BAUMAN_CONTROL_SERVICE_SECRET: ${{ secrets.BAUMAN_CONTROL_SERVICE_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Require explicit preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PREVIEW" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PREVIEW exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Validate required preview configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID CONTROL_OWNER_EMAILS CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD APPLICATION_MANAGEMENT_PREVIEW_ORIGIN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the application-management-preview GitHub environment."
              exit 1
            fi
          done
          case "$APPLICATION_MANAGEMENT_PREVIEW_ORIGIN" in https://*) ;; *) echo '::error::APPLICATION_MANAGEMENT_PREVIEW_ORIGIN must be HTTPS.'; exit 1 ;; esac
          if [[ "$APPLICATION_MANAGEMENT_PREVIEW_ORIGIN" == *.chatgpt.site ]]; then
            echo '::error::Application Management preview must not use ChatGPT Sites.'
            exit 1
          fi
          if [[ -n "${BOI_ECH_BASE_URL:-}" && ${#CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::CONTROL_SERVICE_SECRET is required when Bơi ếch preview is configured.'; exit 1
          fi
          if [[ -n "${HEALTH_CARE_BASE_URL:-}" && ${#HEALTH_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::HEALTH_CONTROL_SERVICE_SECRET is required when Health preview is configured.'; exit 1
          fi
          if [[ -n "${RU_LIFE_BASE_URL:-}" && ${#RU_LIFE_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::RU_LIFE_CONTROL_SERVICE_SECRET is required when RU_LIFE preview is configured.'; exit 1
          fi
          if [[ -n "${BAUMAN_CONTROL_BASE_URL:-}" && ${#BAUMAN_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::BAUMAN_CONTROL_SERVICE_SECRET is required when Bauman preview is configured.'; exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Preserve existing regressions before preview materialization
        run: npm test

      - name: Validate migration boundary
        run: npm run validate:cloudflare-preview

      - name: Materialize isolated preview config
        run: npm run cloudflare:preview:prepare

      - name: Validate materialized Cloudflare config
        run: npm run cloudflare:check

      - name: Apply migrations to preview D1 only
        run: npx wrangler d1 migrations apply application-management-preview-db --remote --config wrangler.cloudflare.jsonc

      - name: Build with Cloudflare preview bindings
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.jsonc
        run: npm run build

      - name: Verify generated preview artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/index.js
          test -f dist/wrangler.json
          test -f .wrangler/deploy/config.json
          if grep -R "1cf8f6b4-6c23-4479-8751-47703ecac92b" dist/wrangler.json .wrangler/deploy/config.json wrangler.cloudflare.jsonc; then
            echo '::error::Preview artifact references legacy ChatGPT Sites D1.'
            exit 1
          fi
          if grep -R "00000000-0000-0000-0000-000000000003" dist/wrangler.json .wrangler/deploy/config.json wrangler.cloudflare.jsonc; then
            echo '::error::Preview artifact references local-only D1.'
            exit 1
          fi
          grep -q 'application-management-preview-db' dist/wrangler.json
          grep -q 'cloudflare-preview' dist/wrangler.json

      - name: Deploy Application Management preview Worker
        run: npx wrangler deploy

      - name: Install Bơi ếch bridge secret
        if: ${{ env.BOI_ECH_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$CONTROL_SERVICE_SECRET" | npx wrangler secret put CONTROL_SERVICE_SECRET --config wrangler.cloudflare.jsonc

      - name: Install Health bridge secret
        if: ${{ env.HEALTH_CARE_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.jsonc

      - name: Install RU_LIFE bridge secret
        if: ${{ env.RU_LIFE_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$RU_LIFE_CONTROL_SERVICE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.jsonc

      - name: Install Bauman bridge secret
        if: ${{ env.BAUMAN_CONTROL_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$BAUMAN_CONTROL_SERVICE_SECRET" | npx wrangler secret put BAUMAN_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.jsonc

      - name: Verify Cloudflare Access blocks anonymous traffic
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APPLICATION_MANAGEMENT_PREVIEW_ORIGIN/__deployment")"
          case "$CODE" in
            200) echo '::error::Anonymous request reached Application Management. Cloudflare Access is not enforcing the preview origin.'; exit 1 ;;
            000) echo '::error::Application Management preview origin is unreachable.'; exit 1 ;;
            *) echo "Anonymous request blocked/redirected by Access with HTTP $CODE." ;;
          esac

      - name: Read back deployment through Cloudflare Access service token
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$APPLICATION_MANAGEMENT_PREVIEW_ORIGIN/__deployment" > /tmp/application-management-deployment.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/application-management-deployment.json', 'utf8'));
          if (value.application !== 'application-management' || value.runtime !== 'control-plane') throw new Error('Application Management deployment identity mismatch.');
          if (value.channel !== 'cloudflare-preview') throw new Error('Application Management deployment channel mismatch.');
          if (!value.revision || value.revision === 'unknown') throw new Error('Application Management build revision missing.');
          if (!value.databaseReady) throw new Error('Application Management preview D1 schema is not ready.');
          if (!value.accessConfigured) throw new Error('Cloudflare Access JWT adapter configuration is missing.');
          if (!value.ownerPolicyConfigured) throw new Error('Application Management owner policy is missing.');
          if (value.networkMode !== 'production') throw new Error('Cloud preview must use production network resolution, never localhost fallback.');
          console.log('Application Management Cloudflare preview read-back PASS.');
          NODE

      - name: Deployment boundary summary
        shell: bash
        run: |
          echo 'Application Management preview deployment completed.'
          echo 'Worker: application-management-preview'
          echo 'D1: application-management-preview-db'
          echo 'Cloudflare Access: anonymous traffic verified blocked; service-token read-back verified.'
          echo 'Production auto-deploy remains disabled.'
