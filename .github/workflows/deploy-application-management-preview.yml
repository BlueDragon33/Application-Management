name: Application Management Cloudflare Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: application-management-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ACCESS_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_ACCESS_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_PREVIEW_ORIGIN: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}
    steps:
      - name: Inspect preview configuration without writes or secret disclosure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID","APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID","APPLICATION_MANAGEMENT_PREVIEW_ACCESS_SECRET"];
          const presence = Object.fromEntries(required.map(name=>[name,Boolean(String(process.env[name]??'').trim())]));
          const origins = Object.fromEntries(['APPLICATION_MANAGEMENT_PREVIEW_ORIGIN','BOI_ECH_PREVIEW_ORIGIN'].map(name=>[name,String(process.env[name]??'').trim()||null]));
          console.log(JSON.stringify({mode:'read-only',presence,origins,publicationAttempted:false},null,2));
          NODE
