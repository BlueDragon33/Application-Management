name: Provision real PriceReport Control Production

on:
  push:
    branches:
      - "ops/provision-real-pricereport-20260925"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: https://application-management.boiech-ai.workers.dev
      PRICE_REPORT_CONTROL_ORIGIN: https://price-report-control-service.boiech-ai.workers.dev
      PRICE_REPORT_APP_ORIGIN: https://bluedragon33.github.io
      PRICE_SHA: 270c7e19d58e67e025fad808e90619478e540e09

    steps:
      - name: Validate central Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/checkout@v4
        with:
          repository: BlueDragon33/PriceReport_Tunggiabao
          ref: ${{ env.PRICE_SHA }}
          path: price

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Generate PriceReport shared control secret
        run: |
          set -euo pipefail
          S="$(openssl rand -hex 40)"
          echo "::add-mask::$S"
          echo "PRICE_REPORT_CONTROL_SERVICE_SECRET=$S" >> "$GITHUB_ENV"

      - name: Ensure PriceReport Control D1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 list --json > /tmp/d1.json
          ID="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=a.find(x=>x.name==="price-report-control-db");process.stdout.write((r&&(r.uuid||r.id))||"")')"
          if [ -z "$ID" ]; then
            npx --yes wrangler@4.92.0 d1 create price-report-control-db
            npx --yes wrangler@4.92.0 d1 list --json > /tmp/d1.json
            ID="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=a.find(x=>x.name==="price-report-control-db");process.stdout.write((r&&(r.uuid||r.id))||"")')"
          fi
          test -n "$ID"
          echo "PRICE_REPORT_CONTROL_D1_DATABASE_ID=$ID" >> "$GITHUB_ENV"

      - name: Build, migrate and deploy PriceReport Control
        working-directory: price/control-service
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run gate
          node scripts/prepare-production.mjs
          npx wrangler d1 migrations apply price-report-control-db --remote --config wrangler.production.jsonc
          npx wrangler deploy --config wrangler.production.jsonc
          printf '%s' "$PRICE_REPORT_CONTROL_SERVICE_SECRET" | npx wrangler secret put PRICE_REPORT_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc

      - name: Verify PriceReport Control health
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/p.json --write-out '%{http_code}' --max-time 20 "$PRICE_REPORT_CONTROL_ORIGIN/health")"
          test "$CODE" = 200 || { cat /tmp/p.json; exit 1; }
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/p.json","utf8"));if(v.application!=="price-report-tunggiabao"||v.databaseReady!==true||v.controlSecretConfigured!==true)throw new Error("PriceReport Control health mismatch");console.log("PriceReport Control health PASS")'
