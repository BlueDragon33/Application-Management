name: RTT selected Chatterbox candidate package
on:
  pull_request:
    paths:
      - 'scripts/russian-time-trainer-chatterbox-candidate.py'
      - '.github/workflows/russian-time-trainer-chatterbox-candidate.yml'
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.number == 423 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15104892325'
          run-id: '45795610640'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rtt-original
          merge-multiple: true
      - name: Verify exact prior WAV package before installing model
        run: |
          python3 - "$RUNNER_TEMP/rtt-original" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); m=json.loads((root/'manifest.json').read_text())
          assert m['revision']=='5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18'
          assert len(m['clips'])==3 and not m['errors']
          expected={'01.wav':'f17296dfd5b73f002d889c66cc8d9300e03eba16e9aa57df4226de9aa78e7ee7','02.wav':'f57bc4dc10f88c5c8c85aa8d5f95a6c93dfefe475da04320bf8a3e4c2c0f675d','03.wav':'39c37b35c55c474b8c260031249ec81e3b1106be31efd5c080dc5267f6e61818'}
          for c in m['clips']:
              assert hashlib.sha256((root/c['file']).read_bytes()).hexdigest()==c['sha256']==expected[c['file']]
          print('Verified three original WAVs')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU synthesis
        run: |
          python -m venv "$RUNNER_TEMP/rtt-model-env"
          P="$RUNNER_TEMP/rtt-model-env/bin/pip"
          "$P" install --disable-pip-version-check torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$P" install --disable-pip-version-check "git+https://github.com/resemble-ai/chatterbox.git@ab55923c27757c90cfcc407baa57dc25a7d25217"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Reuse three approved-for-comparison files and produce eight new samples
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          "$RUNNER_TEMP/rtt-model-env/bin/python" scripts/russian-time-trainer-chatterbox-candidate.py "$RUNNER_TEMP/rtt-selected" "$RUNNER_TEMP/rtt-original"
      - name: Emit bounded verified public MP3 transfer
        run: |
          python3 - "$RUNNER_TEMP/rtt-selected" <<'PY'
          import base64, hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          m=json.loads((root/"manifest.json").read_text())
          assert m["admission"]=="CANDIDATE_ONLY" and len(m["assets"])==11 and not m["failures"]
          for a in m["assets"]:
              assert a["file"]==a["id"]+".mp3" and a["id"].startswith("chatterbox-preview-")
              data=(root/a["file"]).read_bytes()
              assert len(data)<=100000 and hashlib.sha256(data).hexdigest()==a["sha256"]
              print("RTT_PUBLIC_MP3 "+json.dumps({"id":a["id"],"sha256":a["sha256"],"base64":base64.b64encode(data).decode()}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtt-chatterbox-candidate-package
          path: ${{ runner.temp }}/rtt-selected/
          retention-days: 14
          if-no-files-found: error
