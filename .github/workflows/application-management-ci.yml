name: Application Management Development Fast CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-preview-readonly-browser:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'BlueDragon33' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: application-management-preview
    env:
      APPLICATION_MANAGEMENT_PREVIEW_ACCESS_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_ACCESS_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: https://application-management-preview.boiech-ai.workers.dev
      AUTOMATION_PREVIEW_REVISION: 701e4834fa3a03ef0463468c4799a1906c65bab9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install pinned existing browser QA runtime
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify deployed Preview through its real protected login without client mutations
        run: node scripts/automation-preview-browser-check.mjs
      - name: Save sanitized Preview browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-release-central-preview-readonly
          path: |
            qa-artifacts/*.png
            qa-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
