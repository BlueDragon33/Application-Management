name: Application Management Development Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-management-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app/application-registry.ts
          test -f worker/index.ts
          test -f scripts/prepare-cloudflare-preview.mjs
          node --check scripts/prepare-cloudflare-preview.mjs
          node --check scripts/validate-cloudflare-preview.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Development mode summary
        run: echo "Fast CI only. Heavy validation is manual during active development."
