name: Bootstrap managed Production runtimes

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ BOOTSTRAP_MANAGED_RUNTIMES để triển khai Bơi ếch + Health + RU_LIFE + PriceReport Production từ Trung tâm"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: application-management-managed-runtime-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.actor == 'BlueDragon33' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == '/bootstrap-managed-runtimes'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}

    steps:
      - name: Require explicit bootstrap confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.confirm }}" == "BOOTSTRAP_MANAGED_RUNTIMES" ]] || {
              echo "::error::Enter BOOTSTRAP_MANAGED_RUNTIMES exactly."
              exit 1
            }
          else
            [[ "${{ github.actor }}" == "BlueDragon33" && "${{ github.event.comment.body }}" == "/bootstrap-managed-runtimes" ]] || {
              echo "::error::Only the repository owner exact /bootstrap-managed-runtimes command may bootstrap managed runtimes."
              exit 1
            }
          fi

      - name: Checkout Application Management
        uses: actions/checkout@v4
        with:
          path: manager

      - name: Checkout BOIECH_AI
        uses: actions/checkout@v4
        with:
          repository: BlueDragon33/BOIECH_AI
          ref: main
          path: clients/boi

      - name: Checkout Health_Care
        uses: actions/checkout@v4
        with:
          repository: BlueDragon33/Health_Care
          ref: main
          path: clients/health

      - name: Checkout RU_LIFE
        uses: actions/checkout@v4
        with:
          repository: BlueDragon33/RU_LIFE
          ref: main
          path: clients/ru-life

      - name: Checkout PriceReport_Tunggiabao
        uses: actions/checkout@v4
        with:
          repository: BlueDragon33/PriceReport_Tunggiabao
          ref: main
          path: clients/price-report

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: manager/package-lock.json

      - name: Validate central Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID CONTROL_OWNER_EMAILS APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required in application-management-production."; exit 1; }
          done
          case "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" in
            https://*.workers.dev) ;;
            *) echo "::error::Managed runtime bootstrap currently requires the canonical workers.dev Application Management origin."; exit 1 ;;
          esac

      - name: Install Application Management dependencies
        working-directory: manager
        run: npm ci --no-audit --no-fund

      - name: Resolve managed runtime origins
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          const origin = new URL(process.env.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN);
          const labels = origin.hostname.split(".");
          if (labels.length < 4 || labels.slice(-2).join(".") !== "workers.dev") {
            throw new Error("APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN is not a workers.dev origin.");
          }
          const suffix = labels.slice(1).join(".");
          console.log(`BOI_RUNTIME_ORIGIN=https://boi-ech.${suffix}`);
          console.log(`HEALTH_RUNTIME_ORIGIN=https://health-care.${suffix}`);
          console.log(`RU_LIFE_RUNTIME_ORIGIN=https://ru-life.${suffix}`);
          console.log(`PRICE_REPORT_CONTROL_ORIGIN=https://price-report-control-service.${suffix}`);
          console.log("PRICE_REPORT_APP_ORIGIN=https://bluedragon33.github.io");
          NODE

      - name: Ensure isolated managed-client Production D1 databases
        working-directory: manager
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-inventory.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const rows = JSON.parse(fs.readFileSync("/tmp/d1-inventory.json", "utf8"));
          console.log("D1_INVENTORY=" + rows.map((item) => item?.name).filter(Boolean).sort().join(","));
          NODE
          ensure_d1() {
            local name="$1"
            local key="$2"
            local id
            id="$(node --input-type=module - "$name" /tmp/d1-inventory.json <<'NODE'
          import fs from "node:fs";
          const [name, file] = process.argv.slice(2);
          const rows = JSON.parse(fs.readFileSync(file, "utf8"));
          const row = rows.find((item) => item?.name === name);
          if (row) process.stdout.write(String(row.uuid ?? row.id ?? ""));
          NODE
            )"
            if [[ -z "$id" ]]; then
              if ! npx wrangler d1 create "$name" > "/tmp/d1-create-${key}.log" 2>&1; then
                cat "/tmp/d1-create-${key}.log" || true
                echo "::error::Could not create $name. Current D1 inventory is shown above; no database was deleted automatically."
                exit 1
              fi
              npx wrangler d1 list --json > /tmp/d1-inventory.json
              id="$(node --input-type=module - "$name" /tmp/d1-inventory.json <<'NODE'
          import fs from "node:fs";
          const [name, file] = process.argv.slice(2);
          const rows = JSON.parse(fs.readFileSync(file, "utf8"));
          const row = rows.find((item) => item?.name === name);
          if (row) process.stdout.write(String(row.uuid ?? row.id ?? ""));
          NODE
              )"
            fi
            if [[ ! "$id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "::error::Could not resolve D1 UUID for $name."
              exit 1
            fi
            echo "$key=$id" >> "$GITHUB_ENV"
          }
          ensure_d1 "health-care-production-db" "HEALTH_PRODUCTION_D1_DATABASE_ID"
          ensure_d1 "ru-life-production-db" "RU_LIFE_PRODUCTION_D1_DATABASE_ID"
          ensure_d1 "price-report-control-db" "PRICE_REPORT_CONTROL_D1_DATABASE_ID"
          echo "HEALTH_PREVIEW_D1_DATABASE_ID=$APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID" >> "$GITHUB_ENV"
          echo "RU_LIFE_PREVIEW_D1_DATABASE_ID=$APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID" >> "$GITHUB_ENV"

      - name: Generate app-scoped bridge secrets
        shell: bash
        run: |
          set -euo pipefail
          BOI_BRIDGE_SECRET="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.randomBytes(48).toString("base64url"))')"
          HEALTH_BRIDGE_SECRET="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.randomBytes(48).toString("base64url"))')"
          RU_LIFE_BRIDGE_SECRET="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.randomBytes(48).toString("base64url"))')"
          PRICE_REPORT_BRIDGE_SECRET="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.randomBytes(48).toString("base64url"))')"
          echo "::add-mask::$BOI_BRIDGE_SECRET"
          echo "::add-mask::$HEALTH_BRIDGE_SECRET"
          echo "::add-mask::$RU_LIFE_BRIDGE_SECRET"
          echo "::add-mask::$PRICE_REPORT_BRIDGE_SECRET"
          echo "BOI_BRIDGE_SECRET=$BOI_BRIDGE_SECRET" >> "$GITHUB_ENV"
          echo "HEALTH_BRIDGE_SECRET=$HEALTH_BRIDGE_SECRET" >> "$GITHUB_ENV"
          echo "RU_LIFE_BRIDGE_SECRET=$RU_LIFE_BRIDGE_SECRET" >> "$GITHUB_ENV"
          echo "PRICE_REPORT_BRIDGE_SECRET=$PRICE_REPORT_BRIDGE_SECRET" >> "$GITHUB_ENV"

      - name: Install Bơi ếch app-scoped control secret
        working-directory: manager
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BOI_BRIDGE_SECRET" | npx wrangler secret put CONTROL_SERVICE_SECRET --name boi-ech

      - name: Smoke Bơi ếch Production control plane
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in {1..12}; do
            RUNTIME_CODE="$(curl --silent --show-error --output /tmp/boi-runtime.json --write-out '%{http_code}' --max-time 30 "$BOI_RUNTIME_ORIGIN/api/control/runtime" || true)"
            STATUS_CODE="$(curl --silent --show-error --output /tmp/boi-status.json --write-out '%{http_code}' --max-time 30 -H "Authorization: Bearer $BOI_BRIDGE_SECRET" "$BOI_RUNTIME_ORIGIN/api/control/status" || true)"
            if [[ "$RUNTIME_CODE" == "200" && "$STATUS_CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$RUNTIME_CODE" != "200" && "$RUNTIME_CODE" != "404" && "$RUNTIME_CODE" != "000" ]]; then
              echo "::error::Unexpected Bơi ếch runtime HTTP $RUNTIME_CODE."
              cat /tmp/boi-runtime.json || true
              exit 1
            fi
            if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "403" && "$STATUS_CODE" != "503" && "$STATUS_CODE" != "000" ]]; then
              echo "::error::Unexpected Bơi ếch control status HTTP $STATUS_CODE."
              cat /tmp/boi-status.json || true
              exit 1
            fi
            echo "Bơi ếch Production secret/runtime not converged yet (runtime=$RUNTIME_CODE status=$STATUS_CODE, attempt $attempt/12); waiting for Worker propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo "::error::Bơi ếch Production control plane did not converge within 60 seconds after secret installation."
            cat /tmp/boi-runtime.json || true
            cat /tmp/boi-status.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const runtime = JSON.parse(fs.readFileSync("/tmp/boi-runtime.json", "utf8"));
          const status = JSON.parse(fs.readFileSync("/tmp/boi-status.json", "utf8"));
          if (runtime.applicationId !== "boi-ech" || runtime.repository !== "BlueDragon33/BOIECH_AI" || runtime.controlGeneration !== 2) {
            throw new Error("Bơi ếch Production runtime identity mismatch.");
          }
          if (status.application !== "boi-ech" || status.protocol !== "boi-ech-control-v1") {
            throw new Error("Bơi ếch Production control status mismatch.");
          }
          console.log("Bơi ếch Production control bootstrap PASS.");
          NODE

      - name: Install Health_Care dependencies
        working-directory: clients/health
        run: npm ci --no-audit --no-fund

      - name: Materialize Health_Care Production config
        working-directory: clients/health
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)"           HEALTH_PRODUCTION_D1_DATABASE_ID="$HEALTH_PRODUCTION_D1_DATABASE_ID"           HEALTH_PREVIEW_D1_DATABASE_ID="$HEALTH_PREVIEW_D1_DATABASE_ID"           APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN="$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"           node scripts/prepare-cloudflare-production.mjs

      - name: Apply Health_Care Production migrations
        working-directory: clients/health
        run: npx wrangler d1 migrations apply health-care-production-db --remote --config wrangler.cloudflare.production.jsonc

      - name: Build and validate Health_Care Production
        working-directory: clients/health
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.production.jsonc npm run build
          HEALTH_PRODUCTION_D1_DATABASE_ID="$HEALTH_PRODUCTION_D1_DATABASE_ID"           HEALTH_PREVIEW_D1_DATABASE_ID="$HEALTH_PREVIEW_D1_DATABASE_ID"           node scripts/validate-cloudflare-production-artifact.mjs

      - name: Deploy Health_Care Production
        working-directory: clients/health
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$HEALTH_BRIDGE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
          npx wrangler deploy

      - name: Smoke Health_Care Production control plane
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in {1..12}; do
            CONTRACT_CODE="$(curl --silent --show-error --output /tmp/health-contract.json --write-out '%{http_code}' --max-time 30 "$HEALTH_RUNTIME_ORIGIN/api/control/contract" || true)"
            STATUS_CODE="$(curl --silent --show-error --output /tmp/health-status.json --write-out '%{http_code}' --max-time 30 -H "Authorization: Bearer $HEALTH_BRIDGE_SECRET" "$HEALTH_RUNTIME_ORIGIN/api/control/status" || true)"
            if [[ "$CONTRACT_CODE" == "200" && "$STATUS_CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$CONTRACT_CODE" != "200" && "$CONTRACT_CODE" != "404" && "$CONTRACT_CODE" != "000" ]]; then
              echo "::error::Unexpected Health contract HTTP $CONTRACT_CODE."
              cat /tmp/health-contract.json || true
              exit 1
            fi
            if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "403" && "$STATUS_CODE" != "503" && "$STATUS_CODE" != "000" ]]; then
              echo "::error::Unexpected Health control status HTTP $STATUS_CODE."
              cat /tmp/health-status.json || true
              exit 1
            fi
            echo "Health Production secret/runtime not converged yet (contract=$CONTRACT_CODE status=$STATUS_CODE, attempt $attempt/12); waiting for Worker propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo "::error::Health Production control plane did not converge within 60 seconds after secret installation."
            cat /tmp/health-contract.json || true
            cat /tmp/health-status.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const contract = JSON.parse(fs.readFileSync("/tmp/health-contract.json", "utf8"));
          const status = JSON.parse(fs.readFileSync("/tmp/health-status.json", "utf8"));
          if (contract.application !== "health-care" || contract.endpoints?.devices !== "/api/control/devices") throw new Error("Health Production contract mismatch.");
          if (status.application !== "child-health" || !Array.isArray(status.capabilities) || !status.capabilities.includes("app-scoped-secret-v1")) {
            throw new Error("Health Production authenticated status mismatch.");
          }
          console.log("Health_Care Production bootstrap PASS.");
          NODE

      - name: Install RU_LIFE dependencies
        working-directory: clients/ru-life
        run: npm install --no-audit --no-fund

      - name: Materialize RU_LIFE Production config
        working-directory: clients/ru-life
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)"           RU_LIFE_PRODUCTION_D1_DATABASE_ID="$RU_LIFE_PRODUCTION_D1_DATABASE_ID"           RU_LIFE_PREVIEW_D1_DATABASE_ID="$RU_LIFE_PREVIEW_D1_DATABASE_ID"           APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN="$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"           node scripts/prepare-cloudflare-production.mjs

      - name: Apply RU_LIFE Production migrations
        working-directory: clients/ru-life
        run: npx wrangler d1 migrations apply ru-life-production-db --remote --config wrangler.cloudflare.production.jsonc

      - name: Build and validate RU_LIFE Production
        working-directory: clients/ru-life
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.production.jsonc npm run build
          RU_LIFE_PRODUCTION_D1_DATABASE_ID="$RU_LIFE_PRODUCTION_D1_DATABASE_ID"           RU_LIFE_PREVIEW_D1_DATABASE_ID="$RU_LIFE_PREVIEW_D1_DATABASE_ID"           node scripts/validate-cloudflare-production-artifact.mjs

      - name: Deploy RU_LIFE Production
        working-directory: clients/ru-life
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$RU_LIFE_BRIDGE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
          npx wrangler deploy

      - name: Smoke RU_LIFE Production control plane
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in {1..12}; do
            HOME_CODE="$(curl --silent --show-error --output /tmp/ru-life-home.html --write-out '%{http_code}' --max-time 30 "$RU_LIFE_RUNTIME_ORIGIN/" || true)"
            CODE="$(curl --silent --show-error --output /tmp/ru-life-status.json --write-out '%{http_code}' --max-time 30 -H "Authorization: Bearer $RU_LIFE_BRIDGE_SECRET" "$RU_LIFE_RUNTIME_ORIGIN/api/control/status" || true)"
            if [[ "$HOME_CODE" == "200" && "$CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$HOME_CODE" != "200" && "$HOME_CODE" != "404" && "$HOME_CODE" != "000" ]]; then
              echo "::error::Unexpected RU_LIFE runtime HTTP $HOME_CODE."
              exit 1
            fi
            if [[ "$CODE" != "200" && "$CODE" != "403" && "$CODE" != "503" && "$CODE" != "000" ]]; then
              echo "::error::Unexpected RU_LIFE control status HTTP $CODE."
              cat /tmp/ru-life-status.json || true
              exit 1
            fi
            echo "RU_LIFE Production secret/runtime not converged yet (home=$HOME_CODE status=$CODE, attempt $attempt/12); waiting for Worker propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo "::error::RU_LIFE Production control plane did not converge within 60 seconds after secret installation."
            cat /tmp/ru-life-status.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync("/tmp/ru-life-status.json", "utf8"));
          if (status.application !== "ru-life" || status.endpoints?.devices !== "/api/control/devices" || status.capabilities?.deviceRegistration !== true) {
            throw new Error("RU_LIFE Production control status mismatch.");
          }
          console.log("RU_LIFE Production bootstrap PASS.");
          NODE

      - name: Install PriceReport KT Control dependencies
        working-directory: clients/price-report/control-service
        run: npm ci --no-audit --no-fund

      - name: Gate and materialize PriceReport KT Control Production
        working-directory: clients/price-report/control-service
        shell: bash
        run: |
          set -euo pipefail
          npm run gate
          PRICE_REPORT_CONTROL_D1_DATABASE_ID="$PRICE_REPORT_CONTROL_D1_DATABASE_ID" \
          PRICE_REPORT_APP_ORIGIN="$PRICE_REPORT_APP_ORIGIN" \
          APPLICATION_MANAGEMENT_ORIGIN="$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" \
          node scripts/prepare-production.mjs

      - name: Apply PriceReport KT Control Production migrations
        working-directory: clients/price-report/control-service
        run: npx wrangler d1 migrations apply price-report-control-db --remote --config wrangler.production.jsonc

      - name: Deploy PriceReport KT Control Production
        working-directory: clients/price-report/control-service
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc
          printf '%s' "$PRICE_REPORT_BRIDGE_SECRET" | npx wrangler secret put PRICE_REPORT_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          npx wrangler deploy --config wrangler.production.jsonc

      - name: Smoke PriceReport KT Control Production
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in {1..12}; do
            HEALTH_CODE="$(curl --silent --show-error --output /tmp/price-report-health.json --write-out '%{http_code}' --max-time 30 "$PRICE_REPORT_CONTROL_ORIGIN/health" || true)"
            STATUS_CODE="$(curl --silent --show-error --output /tmp/price-report-status.json --write-out '%{http_code}' --max-time 30 -H "Authorization: Bearer $PRICE_REPORT_BRIDGE_SECRET" -H "X-Control-Role: owner" "$PRICE_REPORT_CONTROL_ORIGIN/api/control/status" || true)"
            if [[ "$HEALTH_CODE" == "200" && "$STATUS_CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$HEALTH_CODE" != "200" && "$HEALTH_CODE" != "404" && "$HEALTH_CODE" != "503" && "$HEALTH_CODE" != "000" ]]; then
              echo "::error::Unexpected PriceReport health HTTP $HEALTH_CODE."
              cat /tmp/price-report-health.json || true
              exit 1
            fi
            if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "403" && "$STATUS_CODE" != "503" && "$STATUS_CODE" != "000" ]]; then
              echo "::error::Unexpected PriceReport control status HTTP $STATUS_CODE."
              cat /tmp/price-report-status.json || true
              exit 1
            fi
            echo "PriceReport Production secret/runtime not converged yet (health=$HEALTH_CODE status=$STATUS_CODE, attempt $attempt/12); waiting for Worker propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo "::error::PriceReport Production control plane did not converge within 60 seconds after secret installation."
            cat /tmp/price-report-health.json || true
            cat /tmp/price-report-status.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync("/tmp/price-report-health.json", "utf8"));
          const status = JSON.parse(fs.readFileSync("/tmp/price-report-status.json", "utf8"));
          if (health.application !== "price-report-tunggiabao" || health.protocol !== "price-report-control-v1" || health.databaseReady !== true) {
            throw new Error("PriceReport Production health mismatch.");
          }
          if (status.application !== "price-report-tunggiabao" || status.protocol !== "price-report-control-v1" || status.capabilities?.deviceRegistry !== true) {
            throw new Error("PriceReport Production control status mismatch.");
          }
          console.log("PriceReport KT Control Production bootstrap PASS.");
          NODE

      - name: Build current Application Management Production artifact
        working-directory: manager
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudflare:production:prepare
          npm run cloudflare:production:check
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.production.jsonc npm run build
          npm run cloudflare:production:artifact:check

      - name: Install managed runtime origins and bridge secrets into Application Management
        working-directory: manager
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BOI_RUNTIME_ORIGIN" | npx wrangler secret put BOI_ECH_BASE_URL_OVERRIDE --config wrangler.production.jsonc
          printf '%s' "$HEALTH_RUNTIME_ORIGIN" | npx wrangler secret put HEALTH_CARE_BASE_URL_OVERRIDE --config wrangler.production.jsonc
          printf '%s' "$RU_LIFE_RUNTIME_ORIGIN" | npx wrangler secret put RU_LIFE_BASE_URL_OVERRIDE --config wrangler.production.jsonc
          printf '%s' "$PRICE_REPORT_CONTROL_ORIGIN" | npx wrangler secret put PRICE_REPORT_CONTROL_BASE_URL_OVERRIDE --config wrangler.production.jsonc
          printf '%s' "$BOI_BRIDGE_SECRET" | npx wrangler secret put CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          printf '%s' "$HEALTH_BRIDGE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          printf '%s' "$RU_LIFE_BRIDGE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          printf '%s' "$PRICE_REPORT_BRIDGE_SECRET" | npx wrangler secret put PRICE_REPORT_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          npx wrangler deploy

      - name: Create short-lived owner catalog session
        working-directory: manager
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_QA_TOKEN="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.randomBytes(32).toString("base64url"))')"
          BOOTSTRAP_QA_HASH="$(BOOTSTRAP_QA_TOKEN="$BOOTSTRAP_QA_TOKEN" node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.createHash("sha256").update(process.env.BOOTSTRAP_QA_TOKEN).digest("base64url"))')"
          echo "::add-mask::$BOOTSTRAP_QA_TOKEN"
          echo "BOOTSTRAP_QA_TOKEN=$BOOTSTRAP_QA_TOKEN" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_QA_HASH=$BOOTSTRAP_QA_HASH" >> "$GITHUB_ENV"
          NOW="$(date +%s)"
          EXPIRES="$((NOW + 900))"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command             "INSERT INTO control_sessions (session_id_hash,email,expires_at,created_at,last_seen_at)
             SELECT '$BOOTSTRAP_QA_HASH', email, $EXPIRES, $NOW, $NOW
             FROM control_accounts WHERE role='owner' AND status='active'
             ORDER BY created_at ASC LIMIT 1;"

      - name: Promote Bơi ếch, Health_Care, RU_LIFE and PriceReport into live Dynamic Catalog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const boi = {
            action: "upsert",
            id: "boi-ech",
            name: "Bơi ếch AI",
            shortName: "Bơi ếch",
            category: "Học tập",
            origin: process.env.BOI_RUNTIME_ORIGIN,
            publicUrl: process.env.BOI_RUNTIME_ORIGIN,
            repository: "BlueDragon33/BOIECH_AI",
            contractPath: "/api/application-management/contract",
            credential: process.env.BOI_BRIDGE_SECRET,
          };
          const health = {
            action: "upsert",
            id: "health-care",
            name: "Sức khỏe Y tế",
            shortName: "Sức khỏe Y tế",
            category: "Y tế",
            origin: process.env.HEALTH_RUNTIME_ORIGIN,
            publicUrl: process.env.HEALTH_RUNTIME_ORIGIN,
            repository: "BlueDragon33/Health_Care",
            contractPath: "/api/control/contract",
            credential: process.env.HEALTH_BRIDGE_SECRET,
          };
          const ru = {
            action: "upsert",
            id: "ru-life",
            name: "Hòa nhập Nga",
            shortName: "Hòa nhập Nga",
            category: "Nga",
            origin: process.env.RU_LIFE_RUNTIME_ORIGIN,
            publicUrl: process.env.RU_LIFE_RUNTIME_ORIGIN,
            repository: "BlueDragon33/RU_LIFE",
            contractPath: "/api/control/status",
            credential: process.env.RU_LIFE_BRIDGE_SECRET,
          };
          const priceReport = {
            action: "upsert",
            id: "price-report-tunggiabao",
            name: "PriceReport Tùng Gia Bảo",
            shortName: "Báo giá Tùng Gia Bảo",
            category: "Kế toán",
            origin: process.env.PRICE_REPORT_CONTROL_ORIGIN,
            publicUrl: "https://bluedragon33.github.io/PriceReport_Tunggiabao/",
            repository: "BlueDragon33/PriceReport_Tunggiabao",
            contractPath: "/api/control/status",
            credential: process.env.PRICE_REPORT_BRIDGE_SECRET,
          };
          fs.writeFileSync("/tmp/boi-upsert.json", JSON.stringify(boi));
          fs.writeFileSync("/tmp/health-upsert.json", JSON.stringify(health));
          fs.writeFileSync("/tmp/ru-upsert.json", JSON.stringify(ru));
          fs.writeFileSync("/tmp/price-report-upsert.json", JSON.stringify(priceReport));
          NODE
          for item in boi health ru price-report; do
            CODE="$(curl --silent --show-error --output "/tmp/${item}-upsert-response.json" --write-out '%{http_code}' --max-time 90               -X POST               -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"               -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps"               -H "Sec-Fetch-Site: same-origin"               -H "Content-Type: application/json"               -H "Cookie: __Host-am_prod_session=$BOOTSTRAP_QA_TOKEN"               --data-binary "@/tmp/${item}-upsert.json"               "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
            if [[ "$CODE" != "200" ]]; then
              echo "::error::Catalog upsert for $item failed with HTTP $CODE."
              cat "/tmp/${item}-upsert-response.json" || true
              exit 1
            fi
          done

      - name: Verify live Dynamic Catalog readiness
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/managed-runtime-probe.json --write-out '%{http_code}' --max-time 120             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/json"             -H "Cookie: __Host-am_prod_session=$BOOTSTRAP_QA_TOKEN"             --data '{"action":"probe-all"}'             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          [[ "$CODE" == "200" ]] || { cat /tmp/managed-runtime-probe.json || true; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/managed-runtime-probe.json", "utf8"));
          if (!value.ok || !Array.isArray(value.probes)) throw new Error(value.error || "Invalid probe response.");
          const boi = value.probes.find((entry) => entry.id === "boi-ech");
          if (!boi) throw new Error("Missing boi-ech in Dynamic Catalog probe.");
          if (!boi.contractConnected || !boi.credentialConfigured || boi.remoteAdminReady) {
            throw new Error(`boi-ech Dynamic Contract semantics are invalid: ${JSON.stringify(boi)}`);
          }
          console.log(`SPECIAL boi-ech connection=${boi.connection} protocol=${boi.protocol} remoteAdminReady=${boi.remoteAdminReady}`);
          for (const id of ["health-care", "ru-life", "price-report-tunggiabao"]) {
            const item = value.probes.find((entry) => entry.id === id);
            if (!item) throw new Error(`Missing ${id} in Dynamic Catalog probe.`);
            if (item.connection !== "connected" || !item.contractConnected || !item.credentialConfigured || !item.remoteAdminReady) {
              throw new Error(`${id} is not fully live: ${JSON.stringify(item)}`);
            }
            console.log(`LIVE ${id} protocol=${item.protocol} via=${item.discoveredVia}`);
          }
          console.log("Managed runtime bootstrap PASS.");
          NODE

      - name: Verify Bơi ếch operational fallback is truly live
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/operations-bootstrap.json --write-out '%{http_code}' --max-time 120             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/json"             -H "Cookie: __Host-am_prod_session=$BOOTSTRAP_QA_TOKEN"             --data '{"action":"bootstrap"}'             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/operations")"
          [[ "$CODE" == "200" ]] || { cat /tmp/operations-bootstrap.json || true; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/operations-bootstrap.json", "utf8"));
          const boi = (value.summaries ?? []).find((item) => item.appId === "boi-ech");
          if (!boi) throw new Error("Bơi ếch summary is missing from Production operations.");
          if (boi.connection !== "connected" || boi.controlChannel !== "legacy-adapter" || boi.remoteAdminReady !== true || boi.contractConnected !== true) {
            throw new Error(`Bơi ếch operational fallback is not fully live: ${JSON.stringify(boi)}`);
          }
          console.log(`LIVE boi-ech runtime=${boi.connection} channel=${boi.controlChannel} contract=${boi.contractConnected} admin=${boi.remoteAdminReady}`);
          NODE

      - name: Upload sanitized bootstrap probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-production-bootstrap
          path: |
            /tmp/managed-runtime-probe.json
            /tmp/operations-bootstrap.json
          if-no-files-found: warn
          retention-days: 3

      - name: Delete short-lived owner catalog session
        if: always()
        working-directory: manager
        shell: bash
        run: |
          set +e
          if [[ -n "${BOOTSTRAP_QA_HASH:-}" ]]; then
            npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command               "DELETE FROM control_sessions WHERE session_id_hash='$BOOTSTRAP_QA_HASH';"
          fi
