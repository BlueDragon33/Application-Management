name: Project Repository Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
    paths:
      - "app/project-registry.ts"
      - "scripts/check-project-repositories.mjs"
      - ".github/workflows/project-repository-watch.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check project repository inventory
        run: node scripts/check-project-repositories.mjs
