name: Diagnose Application Management Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Reproduce anonymous and authenticated root while tailing Worker
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/am-tail.log /tmp/am-root-anon.txt /tmp/am-root-auth.txt

          timeout 45s npx wrangler tail application-management --format json > /tmp/am-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 7

          ANON_CODE="$(curl --silent --show-error --location --max-redirs 0 --output /tmp/am-root-anon.txt --write-out '%{http_code}' --max-time 20 "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/" || true)"
          echo "Anonymous root HTTP: $ANON_CODE"

          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import crypto from "node:crypto";
          const token = crypto.randomBytes(32).toString("base64url");
          const hash = crypto.createHash("sha256").update(token).digest("base64url");
          console.log(`DIAG_SESSION_TOKEN=${token}`);
          console.log(`DIAG_SESSION_HASH=${hash}`);
          NODE
          source "$GITHUB_ENV"

          NOW="$(date +%s)"
          EXPIRES="$((NOW + 600))"
          npx wrangler d1 execute application-management-production-db --remote --command             "INSERT INTO control_sessions (session_id_hash,email,expires_at,created_at,last_seen_at,auth_method,step_up_at)
             SELECT '$DIAG_SESSION_HASH', email, $EXPIRES, $NOW, $NOW, 'password', NULL
             FROM control_accounts
             WHERE role='owner' AND status='active'
             ORDER BY created_at ASC LIMIT 1;"

          AUTH_CODE="$(curl --silent --show-error --output /tmp/am-root-auth.txt --write-out '%{http_code}' --max-time 20             -H "Cookie: __Host-am_prod_session=$DIAG_SESSION_TOKEN"             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/" || true)"
          echo "Authenticated root HTTP: $AUTH_CODE"

          npx wrangler d1 execute application-management-production-db --remote --command             "DELETE FROM control_sessions WHERE session_id_hash='$DIAG_SESSION_HASH';" || true

          sleep 7
          wait "$TAIL_PID" || true

          echo "----- Cloudflare Worker exceptions/errors -----"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const raw = fs.existsSync("/tmp/am-tail.log") ? fs.readFileSync("/tmp/am-tail.log", "utf8") : "";
          const lines = raw.split(/\r?\n/).filter(Boolean);
          for (const line of lines) {
            let keep = /exception|error|uncaught|throw|1101/i.test(line);
            try {
              const value = JSON.parse(line);
              const text = JSON.stringify(value);
              keep ||= /exception|error|uncaught|throw|1101/i.test(text);
              if (keep) console.log(text.replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, "Bearer [REDACTED]"));
              continue;
            } catch {}
            if (keep) console.log(line.replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, "Bearer [REDACTED]"));
          }
          NODE

          echo "----- Response snippets -----"
          echo "Anonymous:"
          head -c 600 /tmp/am-root-anon.txt || true
          echo
          echo "Authenticated:"
          head -c 600 /tmp/am-root-auth.txt || true
          echo
