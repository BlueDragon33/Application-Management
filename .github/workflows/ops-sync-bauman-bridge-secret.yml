name: One-shot Sync Bauman Bridge Secret

on:
  push:
    branches:
      - "ops/sync-bauman-bridge-secret-20260925"

permissions:
  contents: read

concurrency:
  group: one-shot-sync-bauman-bridge-secret
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAUMAN_CONTROL_SERVICE_SECRET: ${{ secrets.BAUMAN_CONTROL_SERVICE_SECRET }}
      BAUMAN_CONTROL_ORIGIN: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
    steps:
      - name: Validate canonical Manager bridge configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BAUMAN_CONTROL_SERVICE_SECRET BAUMAN_CONTROL_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in application-management-production."
              exit 1
            fi
          done
          if [[ ${#BAUMAN_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo "::error::BAUMAN_CONTROL_SERVICE_SECRET must contain at least 32 characters."
            exit 1
          fi
          case "$BAUMAN_CONTROL_ORIGIN" in
            https://*) ;;
            *) echo "::error::BAUMAN_CONTROL_ORIGIN must be HTTPS."; exit 1 ;;
          esac
          echo "Manager canonical Bauman bridge configuration is present."

      - name: Synchronize Bauman production Worker secret from Manager canonical secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BAUMAN_CONTROL_SERVICE_SECRET" | npx --yes wrangler@4.92.0 secret put BAUMAN_CONTROL_SERVICE_SECRET --name bauman-control

      - name: Verify Manager-to-Bauman control authentication
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/bauman-control-status.json
          READY=0
          for attempt in {1..12}; do
            CODE="$(curl --silent --show-error --output /tmp/bauman-control-status.json --write-out '%{http_code}' --max-time 20               -H "Authorization: Bearer $BAUMAN_CONTROL_SERVICE_SECRET"               -H "x-control-actor: application-management-secret-sync"               -H "x-control-role: owner"               "$BAUMAN_CONTROL_ORIGIN/api/control/status" || true)"
            if [[ "$CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$CODE" != "403" && "$CODE" != "401" && "$CODE" != "000" ]]; then
              echo "::error::Unexpected Bauman control HTTP $CODE."
              cat /tmp/bauman-control-status.json || true
              exit 1
            fi
            echo "Bauman control secret not active yet (HTTP $CODE, attempt $attempt/12); waiting..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo "::error::Bauman control did not accept Application Management bridge secret within 60 seconds."
            cat /tmp/bauman-control-status.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/bauman-control-status.json','utf8'));
          if (value.application !== 'bauman-master-ai') throw new Error('Bauman control identity mismatch.');
          if (!value.capabilities?.deviceRegistry) throw new Error('Bauman device registry is not live.');
          if (value.endpoints?.devices !== '/api/control/devices') throw new Error('Bauman devices endpoint mismatch.');
          console.log('APPLICATION_MANAGEMENT_TO_BAUMAN_BRIDGE_AUTH=PASS');
          NODE

      - name: Summary
        shell: bash
        run: |
          echo "Bauman production control secret is synchronized from Application Management canonical Production secret."
          echo "No Application Management or Bauman source code was changed on main."
