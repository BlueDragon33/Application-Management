name: Russian Time Trainer human source provenance QA
on:
  pull_request:
    paths:
      - 'scripts/russian-time-trainer-human-source-qa.py'
      - '.github/workflows/russian-time-trainer-human-source-qa.yml'
permissions:
  contents: read
jobs:
  human-source-qa:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.number == 423 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install QA encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Discover exact Russian words and documented speakers
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/russian-time-trainer-human-source-qa.py "$RUNNER_TEMP/rtt-human-candidates" "$RUNNER_TEMP/rtt-human-inspect"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtt-human-source-provenance
          path: ${{ runner.temp }}/rtt-human-candidates/
          retention-days: 7
          if-no-files-found: error
