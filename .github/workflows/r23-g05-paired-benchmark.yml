name: R2.3 G05 Paired Exact-SHA Load QA (not release)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/r23-g05-paired-benchmark.mjs
      - .github/workflows/r23-g05-paired-benchmark.yml

permissions:
  contents: read

concurrency:
  group: r23-g05-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  g05-paired:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 414
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      G05_BASE_SHA: 89a89ce2d3d8ed634ee9562c52744a99223a2b2a
      G05_CANDIDATE_SHA: 9ed41b7d6a4d0ad8b4fc50646276099701ab7fb9
      G05_TARGET_PR: "419"
      G05_PR: "414"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout QA-only harness at exact ledger PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout immutable production baseline main SHA
        uses: actions/checkout@v4
        with:
          ref: 89a89ce2d3d8ed634ee9562c52744a99223a2b2a
          path: r23-g05-baseline
          persist-credentials: false

      - name: Checkout immutable R2.3 candidate PR 419 SHA
        uses: actions/checkout@v4
        with:
          ref: 9ed41b7d6a4d0ad8b4fc50646276099701ab7fb9
          path: r23-g05-candidate
          persist-credentials: false

      - name: Node version locked
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install pinned app dependencies plus QA-only Chromium
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --prefix r23-g05-baseline --no-audit --no-fund
          npm ci --prefix r23-g05-candidate --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium

      - name: Run 360 paired Chromium and D1 source-confirmed measurements
        run: node scripts/r23-g05-paired-benchmark.mjs

      - name: Retain raw evidence on PASS and BLOCKED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r23-g05-exact-sha-evidence
          path: qa-artifacts/r23-g05-paired/
          if-no-files-found: error
          retention-days: 7
