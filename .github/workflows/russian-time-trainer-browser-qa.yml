name: Russian Time Trainer Browser QA

on:
  pull_request:
    paths:
      - 'app/tools/russian-time-trainer/**'
      - 'app/application-hub.tsx'
      - 'app/management-dashboard-v2.tsx'
      - 'scripts/russian-time-trainer-browser-qa.mjs'
      - '.github/workflows/russian-time-trainer-browser-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TRAINER_QA_BROWSER: chrome
      TRAINER_QA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          google-chrome --version
      - name: Run exact-revision browser QA
        run: node scripts/russian-time-trainer-browser-qa.mjs
      - name: Publish QA summary in the run
        if: always()
        run: |
          summary="$RUNNER_TEMP/russian-time-trainer/summary.md"
          if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Attach screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-time-trainer-browser-qa
          path: ${{ runner.temp }}/russian-time-trainer/
          retention-days: 7
          if-no-files-found: ignore

  sound-asset-candidate:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      TRAINER_QA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install version-pinned offline QA synthesizer
        run: |
          sudo apt-get update
          encoder_version=$(apt-cache policy ffmpeg | awk '/Candidate:/ {print $2}')
          test -n "$encoder_version" && test "$encoder_version" != '(none)'
          sudo apt-get install --no-install-recommends -y rhvoice=1.8.0+dfsg-3build3 rhvoice-russian=1.8.0+dfsg-3build3 "ffmpeg=$encoder_version"
          command -v RHVoice-test
          command -v ffmpeg
      - name: Render and decode eight candidate words
        run: node --experimental-strip-types scripts/prepare-russian-time-trainer-sound-assets.mjs "$RUNNER_TEMP/rtt-sound-candidate"
      - name: Attach candidate audio and provenance for human review
        uses: actions/upload-artifact@v4
        with:
          name: russian-time-trainer-sound-candidate
          path: ${{ runner.temp }}/rtt-sound-candidate/
          retention-days: 7
          if-no-files-found: error


  trainer-comparative-qa:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.number == 423 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      RTT_BASELINE: e97df96427cbc03ba5a62cf03cd6cc214340cf90
      RTT_CANDIDATE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e97df96427cbc03ba5a62cf03cd6cc214340cf90
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify equivalent dependency and runtime inputs
        run: |
          cmp candidate/package.json baseline/package.json
          cmp candidate/package-lock.json baseline/package-lock.json
          cmp candidate/vite.config.ts baseline/vite.config.ts
      - name: Install baseline locked dependencies
        working-directory: baseline
        run: npm run install:ci
      - name: Install candidate locked dependencies and browser runtime
        working-directory: candidate
        run: |
          npm run install:ci
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          google-chrome --version
      - name: Paired cold-context measurements and representative contrast review
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rtt-comparison"
          mkdir -p "$out"
          script="$GITHUB_WORKSPACE/candidate/scripts/russian-time-trainer-comparative-qa.mjs"
          (cd baseline; node "$script" baseline "$out/baseline-1.json" "$RTT_BASELINE")
          (cd candidate; node "$script" candidate "$out/candidate-1.json" "$RTT_CANDIDATE")
          (cd candidate; node "$script" candidate "$out/candidate-2.json" "$RTT_CANDIDATE")
          (cd baseline; node "$script" baseline "$out/baseline-2.json" "$RTT_BASELINE")
          node "$script" compare "$out" "$RTT_CANDIDATE"
      - name: Attach measured comparison and unresolved accessibility observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-time-trainer-comparison
          path: ${{ runner.temp }}/rtt-comparison/
          retention-days: 7
          if-no-files-found: error
