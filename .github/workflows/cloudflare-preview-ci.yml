name: Application Management Cloudflare Preview CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run validate:cloudflare-preview
      - run: npm run cloudflare:preview:prepare
      - run: npm run cloudflare:check
      - env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.jsonc
        run: npm run build
      - run: npm run cloudflare:artifact:check
