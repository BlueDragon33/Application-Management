name: Application Management Production Browser Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  diagnose-production-browser:
    if: ${{ github.actor == 'BlueDragon33' && ((github.event_name == 'pull_request' && github.event.pull_request.number == 124) || (github.event_name == 'issue_comment' && github.event.issue.number == 124 && github.event.comment.body == '/diagnose-production-browser-fix')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize isolated Production D1 config
        run: npm run cloudflare:production:prepare

      - name: Create short-lived QA session
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import crypto from "node:crypto";
          const token = crypto.randomBytes(32).toString("base64url");
          const hash = crypto.createHash("sha256").update(token).digest("base64url");
          console.log(`QA_SESSION_TOKEN=${token}`);
          console.log(`QA_SESSION_HASH=${hash}`);
          NODE
          source "$GITHUB_ENV"
          NOW="$(date +%s)"
          EXPIRES="$((NOW + 900))"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command             "INSERT INTO control_sessions (session_id_hash,email,expires_at,created_at,last_seen_at)
             SELECT '$QA_SESSION_HASH', email, $EXPIRES, $NOW, $NOW
             FROM control_accounts
             WHERE role='owner' AND status='active'
             ORDER BY created_at ASC LIMIT 1;"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command             "SELECT COUNT(*) AS qa_session_count FROM control_sessions WHERE session_id_hash='$QA_SESSION_HASH';"

      - name: Install Chromium diagnostic runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run authenticated Production browser diagnostic
        run: node scripts/production-browser-diagnose.mjs

      - name: Upload browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-management-production-browser-diagnostic
          path: |
            /tmp/application-management-production-browser.json
            /tmp/application-management-production-browser.png
          if-no-files-found: warn
          retention-days: 3

      - name: Delete short-lived QA session
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${QA_SESSION_HASH:-}" ]]; then
            npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command               "DELETE FROM control_sessions WHERE session_id_hash='$QA_SESSION_HASH';"
          fi
