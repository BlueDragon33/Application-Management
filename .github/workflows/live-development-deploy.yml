name: Application Management Live Development Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-management-live-development
  cancel-in-progress: true

jobs:
  deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}
      GROWUP_CONTROL_BASE_URL: ${{ vars.GROWUP_CONTROL_PRODUCTION_ORIGIN }}
      GROWUP_CONTROL_SERVICE_SECRET: ${{ secrets.GROWUP_CONTROL_SERVICE_SECRET }}
      PRICE_REPORT_CONTROL_BASE_URL: ${{ vars.PRICE_REPORT_CONTROL_PRODUCTION_ORIGIN || 'https://price-report-control-service.boiech-ai.workers.dev' }}
      PRICE_REPORT_CONTROL_SERVICE_SECRET: ${{ secrets.PRICE_REPORT_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_ACCESS_MODE: standalone
      MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Detect live-development readiness
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID CONTROL_OWNER_EMAILS APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live development deploy skipped; missing: ${missing[*]}"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.ready.outputs.deploy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Production regression gate
        if: steps.ready.outputs.deploy == 'true'
        run: npm test

      - name: Materialize standalone live config
        if: steps.ready.outputs.deploy == 'true'
        run: npm run cloudflare:production:prepare

      - name: Build live web-app
        if: steps.ready.outputs.deploy == 'true'
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.jsonc
        run: npm run build

      - name: Apply D1 migrations
        if: steps.ready.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply application-management-production-db --remote --config wrangler.production.jsonc

      - name: Ensure provider Vault encryption key
        if: steps.ready.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY:-}" ]]; then
            if [[ ! "$MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
              echo '::error::MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY must be a 32-byte URL-safe base64 key.'
              exit 1
            fi
            printf '%s' "$MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY" | npx wrangler secret put MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY --config wrangler.production.jsonc
            echo 'Provider Vault encryption key installed from protected environment secret.'
          elif npx wrangler secret list --config wrangler.production.jsonc 2>/dev/null | grep -q 'MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY'; then
            echo 'Provider Vault encryption key already exists; keeping the current key.'
          else
            GENERATED_KEY="$(node --input-type=module -e "import crypto from 'node:crypto'; process.stdout.write(crypto.randomBytes(32).toString('base64url'))")"
            printf '%s' "$GENERATED_KEY" | npx wrangler secret put MANAGED_APP_CREDENTIAL_ENCRYPTION_KEY --config wrangler.production.jsonc
            unset GENERATED_KEY
            echo 'Provider Vault encryption key created once as a Worker secret.'
          fi

      - name: Install Deploy & Ops provider secrets
        if: steps.ready.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN NEON_API_KEY; do
            value="${!key:-}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | npx wrangler secret put "$key" --config wrangler.production.jsonc
              echo "$key installed as protected Worker secret."
            else
              echo "$key not supplied; existing Worker secret, if any, is left unchanged."
            fi
          done

      - name: Install GrowUP bridge secret
        if: steps.ready.outputs.deploy == 'true' && env.GROWUP_CONTROL_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GROWUP_CONTROL_SERVICE_SECRET:-}" ]]; then
            echo "::notice::GrowUP control origin is configured but bridge secret is missing; GrowUP remains fail-closed/read-only."
          else
            printf '%s' "$GROWUP_CONTROL_SERVICE_SECRET" | npx wrangler secret put GROWUP_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          fi

      - name: Install PriceReport bridge secret
        if: steps.ready.outputs.deploy == 'true' && env.PRICE_REPORT_CONTROL_BASE_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRICE_REPORT_CONTROL_SERVICE_SECRET:-}" ]]; then
            echo "::notice::PriceReport control origin is configured but bridge secret is missing; PriceReport remains fail-closed/read-only."
          else
            printf '%s' "$PRICE_REPORT_CONTROL_SERVICE_SECRET" | npx wrangler secret put PRICE_REPORT_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          fi

      - name: Deploy current main to live Worker
        if: steps.ready.outputs.deploy == 'true'
        run: npx wrangler deploy

      - name: Read back live deployment revision
        if: steps.ready.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/application-management-live.json
          code=""
          verified="false"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --output /tmp/application-management-live.json --write-out '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET" \
              "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__deployment" || true)"
            if [[ "$code" == "200" ]] && node --input-type=module - "$GITHUB_SHA" /tmp/application-management-live.json <<'NODE'
          import fs from "node:fs";
          const expected = process.argv[2];
          const payloadPath = process.argv[3];
          const value = JSON.parse(fs.readFileSync(payloadPath, "utf8"));
          const failures = [];
          if (value.application !== "application-management") failures.push("application");
          if (value.runtime !== "control-plane") failures.push("runtime");
          if (value.channel !== "cloudflare-production") failures.push("channel");
          if (value.revision !== expected) failures.push("revision:" + value.revision);
          if (value.databaseReady !== true) failures.push("database");
          if (value.assetsReady !== true) failures.push("assets");
          if (failures.length) {
            console.error("Live deployment readback not converged: " + failures.join(", "));
            process.exit(1);
          }
          console.log("Live deployment readback PASS for revision " + value.revision);
          NODE
            then
              verified="true"
              break
            fi
            sleep 3
          done
          if [[ "$verified" != "true" ]]; then
            echo "::error::Live deployment readback did not converge after 6 attempts (last HTTP $code)."
            exit 1
          fi

      - name: Development live summary
        if: always()
        run: |
          if [[ "${{ steps.ready.outputs.deploy }}" == "true" ]]; then
            echo "main -> live completed in Standalone Development Mode."
            echo "Access gate: OFF by default."
          else
            echo "Development continues locally; live publish is optional until Cloudflare credentials are configured."
          fi
