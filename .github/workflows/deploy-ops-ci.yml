name: Deploy & Ops Integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/deploy-ops.server.ts"
      - "app/api/deploy-ops/**"
      - "app/tools/deploy-ops/**"
      - "app/admin-device-client.ts"
      - "app/management-dashboard-v2.tsx"
      - "db/schema.ts"
      - "drizzle/0006_deploy_ops.sql"
      - "worker/index.ts"
      - "scripts/prepare-cloudflare-preview.mjs"
      - "scripts/prepare-cloudflare-production.mjs"
      - ".github/workflows/*deploy*.yml"
      - "tests/deploy-ops.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production-shaped build
        run: npm run build
