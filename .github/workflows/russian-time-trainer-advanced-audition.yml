name: RTT advanced short offline audition
on:
  pull_request:
    paths:
      - 'scripts/russian-time-trainer-advanced-audition.py'
      - '.github/workflows/russian-time-trainer-advanced-audition.yml'
permissions:
  contents: read
jobs:
  audition:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.number == 423 && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        engine: [tera] # Chatterbox continues in run 45795610640; no duplicate.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU dependencies
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          python -m venv "$RUNNER_TEMP/rtt-advanced-env"
          P="$RUNNER_TEMP/rtt-advanced-env/bin/pip"
          if [ "$ENGINE" = tera ]; then
            "$P" install --disable-pip-version-check numpy==1.26.4 onnxruntime==1.22.1 huggingface_hub==0.34.4 num2words==0.5.14 transformers==4.48.3
          else
            "$P" install --disable-pip-version-check torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            "$P" install --disable-pip-version-check "git+https://github.com/resemble-ai/chatterbox.git@ab55923c27757c90cfcc407baa57dc25a7d25217"
          fi
      - name: Produce short Russian audio locally
        env:
          ENGINE: ${{ matrix.engine }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          "$RUNNER_TEMP/rtt-advanced-env/bin/python" scripts/russian-time-trainer-advanced-audition.py "$ENGINE" "$RUNNER_TEMP/rtt-advanced"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtt-advanced-${{ matrix.engine }}
          path: ${{ runner.temp }}/rtt-advanced/
          retention-days: 7
          if-no-files-found: error
