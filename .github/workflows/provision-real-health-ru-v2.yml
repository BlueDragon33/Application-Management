name: Provision real Health and RU Production runtimes

on:
  push:
    branches:
      - "ops/provision-real-health-ru-v2-20260925"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD: ${{ secrets.APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD }}
      APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET }}
      BAUMAN_CONTROL_SERVICE_SECRET: ${{ secrets.BAUMAN_CONTROL_SERVICE_SECRET }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: https://application-management.boiech-ai.workers.dev
      HEALTH_PRODUCTION_ORIGIN: https://health-care.boiech-ai.workers.dev
      RU_LIFE_PRODUCTION_ORIGIN: https://ru-life.boiech-ai.workers.dev
      BAUMAN_CONTROL_BASE_URL: https://bauman-control.boiech-ai.workers.dev
      BAUMAN_APP_ORIGIN: https://bauman-master-ai.boiech-ai.workers.dev
      MANAGER_SHA: b27df756d72c21607c7b39446c5f99a330a95012
      HEALTH_SHA: 061485b852b1ac9ee1c29a94553fa6bc109ac43b
      RU_SHA: 00a9c755826f4779d939b6b09a502529335ca1dd

    steps:
      - name: Validate central Production credentials
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET CONTROL_OWNER_EMAILS BAUMAN_CONTROL_SERVICE_SECRET; do
            test -n "${!key:-}" || { echo "::error::$key missing"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          repository: BlueDragon33/Application-Management
          ref: ${{ env.MANAGER_SHA }}
          path: manager

      - uses: actions/checkout@v4
        with:
          repository: BlueDragon33/Health_Care
          ref: ${{ env.HEALTH_SHA }}
          path: health

      - uses: actions/checkout@v4
        with:
          repository: BlueDragon33/RU_LIFE
          ref: ${{ env.RU_SHA }}
          path: ru

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Generate shared bridge secrets
        run: |
          set -euo pipefail
          H="$(openssl rand -hex 40)"
          R="$(openssl rand -hex 40)"
          echo "::add-mask::$H"
          echo "::add-mask::$R"
          echo "HEALTH_CONTROL_SERVICE_SECRET=$H" >> "$GITHUB_ENV"
          echo "RU_LIFE_CONTROL_SERVICE_SECRET=$R" >> "$GITHUB_ENV"

      - name: Ensure Health Production D1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 list --json > /tmp/d1.json
          ID="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=a.find(x=>x.name==="health-care-production-db");process.stdout.write((r&&(r.uuid||r.id))||"")')"
          if [ -z "$ID" ]; then
            npx --yes wrangler@4.92.0 d1 create health-care-production-db
            npx --yes wrangler@4.92.0 d1 list --json > /tmp/d1.json
            ID="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=a.find(x=>x.name==="health-care-production-db");process.stdout.write((r&&(r.uuid||r.id))||"")')"
          fi
          test -n "$ID"
          echo "HEALTH_PRODUCTION_D1_DATABASE_ID=$ID" >> "$GITHUB_ENV"

      - name: Ensure RU Production D1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 d1 list --json > /tmp/d1.json
          ID="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=a.find(x=>x.name==="ru-life-production-db");process.stdout.write((r&&(r.uuid||r.id))||"")')"
          if [ -z "$ID" ]; then
            npx --yes wrangler@4.92.0 d1 create ru-life-production-db
            npx --yes wrangler@4.92.0 d1 list --json > /tmp/d1.json
            ID="$(node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=a.find(x=>x.name==="ru-life-production-db");process.stdout.write((r&&(r.uuid||r.id))||"")')"
          fi
          test -n "$ID"
          echo "RU_LIFE_PRODUCTION_D1_DATABASE_ID=$ID" >> "$GITHUB_ENV"

      - name: Deploy Health Production
        working-directory: health
        env:
          APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ env.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
          HEALTH_PREVIEW_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: |
          set -euo pipefail
          npm ci
          node scripts/prepare-cloudflare-production.mjs
          npx wrangler d1 migrations apply health-care-production-db --remote --config wrangler.cloudflare.production.jsonc
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.production.jsonc npm run build
          HEALTH_PREVIEW_D1_DATABASE_ID=11111111-1111-4111-8111-111111111111 node scripts/validate-cloudflare-production-artifact.mjs
          npx wrangler deploy
          printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
          npx wrangler deploy

      - name: Deploy RU_LIFE Production
        working-directory: ru
        env:
          APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ env.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
          RU_LIFE_PREVIEW_D1_DATABASE_ID: 22222222-2222-4222-8222-222222222222
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node scripts/prepare-cloudflare-production.mjs
          npx wrangler d1 migrations apply ru-life-production-db --remote --config wrangler.cloudflare.production.jsonc
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.production.jsonc npm run build
          RU_LIFE_PREVIEW_D1_DATABASE_ID=22222222-2222-4222-8222-222222222222 node scripts/validate-cloudflare-production-artifact.mjs
          npx wrangler deploy
          printf '%s' "$RU_LIFE_CONTROL_SERVICE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
          npx wrangler deploy

      - name: Smoke Health and RU control runtimes
        run: |
          set -euo pipefail
          H="$(curl --silent --show-error --output /tmp/h.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $HEALTH_CONTROL_SERVICE_SECRET" "$HEALTH_PRODUCTION_ORIGIN/api/control/status")"
          R="$(curl --silent --show-error --output /tmp/r.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $RU_LIFE_CONTROL_SERVICE_SECRET" "$RU_LIFE_PRODUCTION_ORIGIN/api/control/status")"
          test "$H" = 200 || { cat /tmp/h.json; exit 1; }
          test "$R" = 200 || { cat /tmp/r.json; exit 1; }

      - name: Redeploy Manager with real Health and RU origins
        working-directory: manager
        env:
          GITHUB_SHA: ${{ env.MANAGER_SHA }}
          HEALTH_CARE_BASE_URL: ${{ env.HEALTH_PRODUCTION_ORIGIN }}
          RU_LIFE_BASE_URL: ${{ env.RU_LIFE_PRODUCTION_ORIGIN }}
          BOI_ECH_BASE_URL: ""
          GROWUP_BASE_URL: ""
          BAUMAN_CONTROL_BASE_URL: ${{ env.BAUMAN_CONTROL_BASE_URL }}
          BAUMAN_APP_ORIGIN: ${{ env.BAUMAN_APP_ORIGIN }}
        run: |
          set -euo pipefail
          npm ci
          node scripts/prepare-cloudflare-production.mjs
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.production.jsonc npm run build
          npx wrangler deploy
          printf '%s' "$APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD" | npx wrangler secret put APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD --config wrangler.production.jsonc
          printf '%s' "$APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET" | npx wrangler secret put APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET --config wrangler.production.jsonc
          printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          printf '%s' "$RU_LIFE_CONTROL_SERVICE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          printf '%s' "$BAUMAN_CONTROL_SERVICE_SECRET" | npx wrangler secret put BAUMAN_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc
          npx wrangler deploy

      - name: Read back Manager revision
        run: |
          set -euo pipefail
          C="$(curl --silent --show-error --output /tmp/m.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET" "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__deployment")"
          test "$C" = 200 || { cat /tmp/m.json; exit 1; }
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/m.json","utf8"));if(v.revision!==process.env.MANAGER_SHA)throw new Error("revision mismatch");console.log("Manager read-back PASS")'
