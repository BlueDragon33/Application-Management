name: Application Management Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PRODUCTION để triển khai Application Management Production lên Cloudflare"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: application-management-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD: ${{ secrets.APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD }}
      APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}
      CONTROL_SERVICE_SECRET: ${{ secrets.CONTROL_SERVICE_SECRET }}
      HEALTH_CONTROL_SERVICE_SECRET: ${{ secrets.HEALTH_CONTROL_SERVICE_SECRET }}
      RU_LIFE_CONTROL_SERVICE_SECRET: ${{ secrets.RU_LIFE_CONTROL_SERVICE_SECRET }}
      BAUMAN_CONTROL_SERVICE_SECRET: ${{ secrets.BAUMAN_CONTROL_SERVICE_SECRET }}

    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.confirm }}" != "DEPLOY_PRODUCTION" ]]; then
              echo '::error::Deployment cancelled. Enter DEPLOY_PRODUCTION exactly.'
              exit 1
            fi
          else
            if [[ "${{ github.actor }}" != "BlueDragon33" || "${{ github.event.comment.body }}" != "/deploy-production-bootstrap-e2e" ]]; then
              echo '::error::One-shot Production diagnostic deploy requires the repository owner and exact command.'
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Validate required production configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET CONTROL_OWNER_EMAILS APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the application-management-production GitHub environment."
              exit 1
            fi
          done
          if [[ ${#APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD} -lt 14 ]]; then
            echo '::error::APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD must contain at least 14 characters.'
            exit 1
          fi
          if [[ ${#APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET} -lt 32 ]]; then
            echo '::error::APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET must contain at least 32 characters.'
            exit 1
          fi
          if [[ "$APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID" == "$APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID" ]]; then
            echo '::error::Production D1 must not reuse Preview D1.'
            exit 1
          fi
          case "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" in https://*) ;; *) echo '::error::APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN must be HTTPS.'; exit 1 ;; esac
          if [[ "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" == *.chatgpt.site ]]; then
            echo '::error::Cloudflare Production must not use ChatGPT Sites origin.'
            exit 1
          fi
          if [[ -n "${BOI_ECH_BASE_URL:-}" && ${#CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::CONTROL_SERVICE_SECRET is required when Bơi ếch production is configured.'; exit 1
          fi
          if [[ -n "${HEALTH_CARE_BASE_URL:-}" && ${#HEALTH_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::HEALTH_CONTROL_SERVICE_SECRET is required when Health production is configured.'; exit 1
          fi
          if [[ -n "${RU_LIFE_BASE_URL:-}" && ${#RU_LIFE_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::RU_LIFE_CONTROL_SERVICE_SECRET is required when RU_LIFE production is configured.'; exit 1
          fi
          if [[ -n "${BAUMAN_CONTROL_BASE_URL:-}" && ${#BAUMAN_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::BAUMAN_CONTROL_SERVICE_SECRET is required when Bauman production is configured.'; exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Preserve existing regressions before production materialization
        run: npm test

      - name: Materialize isolated production config
        run: npm run cloudflare:production:prepare

      - name: Validate production boundary
        run: npm run cloudflare:production:check

      - name: Apply migrations to production D1 only
        run: npx wrangler d1 migrations apply application-management-production-db --remote --config wrangler.production.jsonc

      - name: Build with Cloudflare production bindings
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.jsonc
        run: npm run build

      - name: Verify generated production artifact
        run: npm run cloudflare:production:artifact:check

      - name: Deploy Application Management production Worker
        run: npx wrangler deploy

      - name: Install initial administrator password
        shell: bash
        run: printf '%s' "$APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD" | npx wrangler secret put APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD --config wrangler.production.jsonc

      - name: Install production read-back secret
        shell: bash
        run: printf '%s' "$APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET" | npx wrangler secret put APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET --config wrangler.production.jsonc

      - name: Install Bơi ếch bridge secret
        if: ${{ env.BOI_ECH_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$CONTROL_SERVICE_SECRET" | npx wrangler secret put CONTROL_SERVICE_SECRET --config wrangler.production.jsonc

      - name: Install Health bridge secret
        if: ${{ env.HEALTH_CARE_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc

      - name: Install RU_LIFE bridge secret
        if: ${{ env.RU_LIFE_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$RU_LIFE_CONTROL_SERVICE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc

      - name: Install Bauman bridge secret
        if: ${{ env.BAUMAN_CONTROL_BASE_URL != '' }}
        shell: bash
        run: printf '%s' "$BAUMAN_CONTROL_SERVICE_SECRET" | npx wrangler secret put BAUMAN_CONTROL_SERVICE_SECRET --config wrangler.production.jsonc

      - name: Verify production login route and anonymous protection
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_CODE="$(curl --silent --show-error --output /tmp/production-login.html --write-out '%{http_code}' --max-time 15 "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"
          if [[ "$LOGIN_CODE" != "200" ]]; then
            echo "::error::Expected Production /__login to return 200, got HTTP $LOGIN_CODE."
            exit 1
          fi
          if grep -qi 'preview access secret' /tmp/production-login.html; then
            echo '::error::Production login page must not expose Preview login wording.'
            exit 1
          fi
          FORM_CODE="$(curl --silent --show-error --output /tmp/production-login-post.html --write-out '%{http_code}' --max-time 15 \
            -X POST \
            -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data 'email=invalid&password=0123456789abcdef' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"
          if [[ "$FORM_CODE" == "403" ]]; then
            echo '::error::Browser-like same-origin Production login POST was incorrectly rejected as Forbidden.'
            cat /tmp/production-login-post.html || true
            exit 1
          fi
          NULL_ORIGIN_CODE="$(curl --silent --show-error --output /tmp/production-login-null-origin.html --write-out '%{http_code}' --max-time 15 \
            -X POST \
            -H "Origin: null" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data 'email=invalid&password=0123456789abcdef' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"
          if [[ "$NULL_ORIGIN_CODE" == "403" ]]; then
            echo '::error::Privacy-browser Production login POST was incorrectly rejected as Forbidden.'
            cat /tmp/production-login-null-origin.html || true
            exit 1
          fi
          CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__deployment")"
          if [[ "$CODE" != "401" ]]; then
            echo "::error::Expected anonymous Production /__deployment to return 401, got HTTP $CODE."
            exit 1
          fi
          echo 'Production anonymous access is blocked and login route is available.'

      - name: Bootstrap and verify real Production owner login when still using the bootstrap password
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --json             --command "SELECT COUNT(*) AS account_count, COALESCE(MAX(must_change_password),0) AS any_must_change FROM control_accounts;"             > /tmp/production-account-state.json

          read -r ACCOUNT_COUNT ANY_MUST_CHANGE < <(node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('/tmp/production-account-state.json', 'utf8'));
          const root = Array.isArray(raw) ? raw[0] : raw;
          const rows = root?.results ?? root?.result?.[0]?.results ?? root?.result?.results ?? [];
          const row = Array.isArray(rows) ? rows[0] : null;
          if (!row) throw new Error('Could not read Production account state from D1.');
          process.stdout.write(`${Number(row.account_count ?? 0)} ${Number(row.any_must_change ?? 0)}`);
          NODE
          )

          if [[ "$ACCOUNT_COUNT" -gt 1 || ( "$ACCOUNT_COUNT" -eq 1 && "$ANY_MUST_CHANGE" -ne 1 ) ]]; then
            echo "Production owner account is already initialized beyond bootstrap; skipping credential E2E."
            exit 0
          fi

          OWNER_EMAIL="${CONTROL_OWNER_EMAILS%%,*}"
          OWNER_EMAIL="$(printf '%s' "$OWNER_EMAIL" | xargs)"
          rm -f /tmp/production-owner.cookies /tmp/production-owner.headers /tmp/production-owner.body

          LOGIN_CODE="$(curl --silent --show-error             --output /tmp/production-owner.body             --dump-header /tmp/production-owner.headers             --cookie-jar /tmp/production-owner.cookies             --write-out '%{http_code}'             --max-time 30             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "email=$OWNER_EMAIL"             --data-urlencode "password=$APPLICATION_MANAGEMENT_INITIAL_ADMIN_PASSWORD"             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"

          if [[ "$LOGIN_CODE" != "303" ]]; then
            STAGE="$(awk -F': *' 'tolower($1)=="x-application-management-auth-stage"{gsub("\r","",$2); print $2}' /tmp/production-owner.headers | tail -n1)"
            echo "::error::Real Production owner login failed with HTTP $LOGIN_CODE at stage ${STAGE:-unknown}."
            cat /tmp/production-owner.body || true
            exit 1
          fi

          ACCOUNT_CODE="$(curl --silent --show-error             --output /tmp/production-owner-account.html             --write-out '%{http_code}'             --max-time 20             --cookie /tmp/production-owner.cookies             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__account")"
          if [[ "$ACCOUNT_CODE" != "200" ]] || ! grep -q 'Tài khoản & bảo mật' /tmp/production-owner-account.html; then
            echo "::error::Production owner session did not open /__account successfully (HTTP $ACCOUNT_CODE)."
            exit 1
          fi

          curl --silent --show-error --output /dev/null --max-time 15             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__account"             -H "Sec-Fetch-Site: same-origin"             --cookie /tmp/production-owner.cookies             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__logout" || true

          echo 'Real Production owner bootstrap/login/session/account E2E PASS.'

      - name: Read back production deployment through health secret
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/application-management-production.json
          READY=0
          for attempt in {1..12}; do
            CODE="$(curl --silent --show-error --output /tmp/application-management-production.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET" "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__deployment" || true)"
            if [[ "$CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$CODE" != "401" && "$CODE" != "403" && "$CODE" != "404" && "$CODE" != "000" ]]; then
              echo "::error::Unexpected Production read-back HTTP $CODE."
              cat /tmp/application-management-production.json || true
              exit 1
            fi
            echo "Production read-back not ready yet (HTTP $CODE, attempt $attempt/12); waiting for Cloudflare secret/version propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo '::error::Production read-back did not become ready within 60 seconds after secret installation.'
            cat /tmp/application-management-production.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/application-management-production.json', 'utf8'));
          if (value.application !== 'application-management' || value.runtime !== 'control-plane') throw new Error('Production deployment identity mismatch.');
          if (value.channel !== 'cloudflare-production') throw new Error('Production deployment channel mismatch.');
          if (!value.revision || value.revision === 'unknown') throw new Error('Production build revision missing.');
          if (!value.databaseReady) throw new Error('Production D1 schema is not ready.');
          if (!value.productionAuthConfigured) throw new Error('Production account authentication is not configured.');
          if (value.accessMode !== 'account-session') throw new Error('Unexpected Production access mode.');
          if (!value.ownerPolicyConfigured) throw new Error('Production owner policy is missing.');
          if (value.networkMode !== 'production') throw new Error('Production must use production network resolution.');
          console.log('Application Management Cloudflare production read-back PASS.');
          NODE

      - name: Production deployment summary
        shell: bash
        run: |
          echo 'Application Management Production deployment completed.'
          echo 'Worker: application-management'
          echo 'D1: application-management-production-db'
          echo 'Access: email/password account session; Preview secret is not used.'
          echo 'Deployment remains manual-only.'
