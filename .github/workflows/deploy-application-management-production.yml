name: Application Management Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "INSPECT_PRODUCTION để chỉ kiểm tra; DEPLOY_PRODUCTION để phát hành bản đã duyệt"
        required: true
        type: string
      release_revision:
        description: "SHA 40 ký tự của bản đã duyệt, phải trùng nhánh được chọn; bỏ trống khi chỉ kiểm tra"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: application-management-cloudflare-production
  cancel-in-progress: false

jobs:
  inspect-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'INSPECT_PRODUCTION' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: application-management-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Inspect protected production without writes
        run: node scripts/inspect-production-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness
          path: .sites-runtime/production-inspection/readiness.json
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    # Manual-only reactivation proposal: requires owner approval of this PR before release.
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'BlueDragon33' && inputs.confirm == 'DEPLOY_PRODUCTION' && inputs.release_revision == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: application-management-production
    env:
      RELEASE_CONFIRM: ${{ inputs.confirm }}
      RELEASE_REVISION: ${{ inputs.release_revision }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ secrets.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET: ${{ secrets.APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PRODUCTION_ORIGIN || 'https://boi-ech.boiech-ai.workers.dev' }}
      HEALTH_CARE_BASE_URL: ${{ vars.HEALTH_CARE_PRODUCTION_ORIGIN }}
      RU_LIFE_BASE_URL: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_BASE_URL: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_APP_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      GROWUP_BASE_URL: ${{ vars.GROWUP_PRODUCTION_ORIGIN }}
      GROWUP_CONTROL_BASE_URL: ${{ vars.GROWUP_CONTROL_PRODUCTION_ORIGIN }}
      PRICE_REPORT_CONTROL_BASE_URL: ${{ vars.PRICE_REPORT_CONTROL_PRODUCTION_ORIGIN || 'https://price-report-control-service.boiech-ai.workers.dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Require owner confirmation of the exact checked-out revision
        run: node scripts/production-release-control.mjs check

      - name: Normalize consumed Cloudflare account identifier
        run: node scripts/production-release-control.mjs normalize-account

      - name: Validate required production configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the application-management-production GitHub environment."
              exit 1
            fi
          done
          if [[ ${#APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET} -lt 32 ]]; then
            echo '::error::APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET must contain at least 32 characters.'
            exit 1
          fi
          if [[ "$APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID" == "$APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID" ]]; then
            echo '::error::Production D1 must not reuse Preview D1.'
            exit 1
          fi
          case "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" in https://*) ;; *) echo '::error::APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN must be HTTPS.'; exit 1 ;; esac
          if [[ "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" == *.chatgpt.site ]]; then
            echo '::error::Cloudflare Production must not use ChatGPT Sites origin.'
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh read-only readiness and rollback evidence before release
        run: node scripts/inspect-production-readiness.mjs

      - name: Preserve sanitized pre-release rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-readiness
          path: .sites-runtime/production-inspection/readiness.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Production regression gate
        run: npm test

      - name: Preserve live production variables without credential changes
        run: node scripts/production-release-control.mjs preserve-vars

      - name: Materialize isolated production config
        run: npm run cloudflare:production:prepare

      - name: Validate production boundary
        run: npm run cloudflare:production:check

      - name: Build with Cloudflare production bindings
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.jsonc
        run: npm run build

      - name: Verify generated production artifact
        run: npm run cloudflare:production:artifact:check

      - name: Apply migrations to production D1 only
        run: npx wrangler d1 migrations apply application-management-production-db --remote --config wrangler.production.jsonc

      - name: Deploy Application Management production Worker
        run: npx wrangler deploy --keep-vars

      - name: Verify production login route and anonymous protection
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_CODE="$(curl --silent --show-error --output /tmp/production-login.html --write-out '%{http_code}' --max-time 15 "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"
          if [[ "$LOGIN_CODE" != "200" ]]; then
            echo "::error::Expected Production /__login to return 200, got HTTP $LOGIN_CODE."
            exit 1
          fi
          if grep -qi 'preview access secret' /tmp/production-login.html; then
            echo '::error::Production login page must not expose Preview login wording.'
            exit 1
          fi
          if node --input-type=module -e 'import fs from "node:fs"; process.exit(JSON.parse(fs.readFileSync(".sites-runtime/production-inspection/readiness.json", "utf8")).liveAccessMode === "google-oauth+account-session" ? 0 : 1)'; then
            if ! grep -q 'Tiếp tục với Google' /tmp/production-login.html; then
              echo '::error::Production login no longer exposes its existing Google sign-in.'
              exit 1
            fi
            GOOGLE_START_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__auth/google")"
            if [[ "$GOOGLE_START_CODE" != "303" ]]; then
              echo "::error::Expected Google OAuth start route to redirect with 303, got HTTP $GOOGLE_START_CODE."
              exit 1
            fi
          fi
          FORM_CODE="$(curl --silent --show-error --output /tmp/production-login-post.html --write-out '%{http_code}' --max-time 15 \
            -X POST \
            -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data 'email=invalid&password=0123456789abcdef' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"
          if [[ "$FORM_CODE" == "403" ]]; then
            echo '::error::Browser-like same-origin Production login POST was incorrectly rejected as Forbidden.'
            cat /tmp/production-login-post.html || true
            exit 1
          fi
          NULL_ORIGIN_CODE="$(curl --silent --show-error --output /tmp/production-login-null-origin.html --write-out '%{http_code}' --max-time 15 \
            -X POST \
            -H "Origin: null" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data 'email=invalid&password=0123456789abcdef' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__login")"
          if [[ "$NULL_ORIGIN_CODE" == "403" ]]; then
            echo '::error::Privacy-browser Production login POST was incorrectly rejected as Forbidden.'
            cat /tmp/production-login-null-origin.html || true
            exit 1
          fi
          CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__deployment")"
          if [[ "$CODE" != "401" ]]; then
            echo "::error::Expected anonymous Production /__deployment to return 401, got HTTP $CODE."
            exit 1
          fi
          echo 'Production anonymous access is blocked and login route is available.'

      - name: Read back production deployment through health secret
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/application-management-production.json
          READY=0
          for attempt in {1..12}; do
            CODE="$(curl --silent --show-error --output /tmp/application-management-production.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $APPLICATION_MANAGEMENT_PRODUCTION_READBACK_SECRET" "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/__deployment" || true)"
            if [[ "$CODE" == "200" ]] && node scripts/production-release-control.mjs readback /tmp/application-management-production.json; then
              READY=1
              break
            fi
            if [[ "$CODE" != "200" && "$CODE" != "401" && "$CODE" != "403" && "$CODE" != "404" && "$CODE" != "000" ]]; then
              echo "::error::Unexpected Production read-back HTTP $CODE."
              exit 1
            fi
            echo "Production read-back not ready yet (HTTP $CODE, attempt $attempt/12); waiting for Cloudflare secret/version propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo '::error::Exact approved Production revision did not become ready after deployment.'
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/application-management-production.json', 'utf8'));
          if (value.application !== 'application-management' || value.runtime !== 'control-plane') throw new Error('Production deployment identity mismatch.');
          if (value.channel !== 'cloudflare-production') throw new Error('Production deployment channel mismatch.');
          if (value.revision !== process.env.RELEASE_REVISION) throw new Error('Production build revision differs from the approved release.');
          if (!value.databaseReady) throw new Error('Production D1 schema is not ready.');
          if (!value.assetsReady) throw new Error('Production static assets are not ready on the live Worker version.');
          if (!value.productionAuthConfigured) throw new Error('Production account authentication is not configured.');
          const baseline = JSON.parse(fs.readFileSync('.sites-runtime/production-inspection/readiness.json', 'utf8'));
          const googleExpected = baseline.liveAccessMode === 'google-oauth+account-session';
          if (googleExpected && !value.googleAuthConfigured) throw new Error('Google OAuth secrets were supplied but the live Worker did not enable Google authentication.');
          const expectedAccessMode = baseline.liveAccessMode;
          if (value.accessMode !== expectedAccessMode) throw new Error(`Unexpected Production access mode: ${value.accessMode}; expected ${expectedAccessMode}.`);
          if (!value.ownerPolicyConfigured) throw new Error('Production owner policy is missing.');
          if (value.networkMode !== 'production') throw new Error('Production must use production network resolution.');
          console.log('Application Management Cloudflare production read-back PASS.');
          NODE

      - name: Create short-lived owner contract probe session
        shell: bash
        run: |
          set -euo pipefail
          CATALOG_QA_SESSION_TOKEN="$(node --input-type=module -e 'import crypto from "node:crypto"; process.stdout.write(crypto.randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$CATALOG_QA_SESSION_TOKEN"
          CATALOG_QA_SESSION_HASH="$(printf '%s' "$CATALOG_QA_SESSION_TOKEN" | node --input-type=module -e 'import crypto from "node:crypto"; let value=""; for await (const chunk of process.stdin) value+=chunk; process.stdout.write(crypto.createHash("sha256").update(value).digest("base64url"))')"
          printf 'CATALOG_QA_SESSION_TOKEN=%s\nCATALOG_QA_SESSION_HASH=%s\n' "$CATALOG_QA_SESSION_TOKEN" "$CATALOG_QA_SESSION_HASH" >> "$GITHUB_ENV"
          NOW="$(date +%s)"
          EXPIRES="$((NOW + 600))"
          npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command             "INSERT INTO control_sessions (session_id_hash,email,expires_at,created_at,last_seen_at)
             SELECT '$CATALOG_QA_SESSION_HASH', email, $EXPIRES, $NOW, $NOW
             FROM control_accounts
             WHERE role='owner' AND status='active'
             ORDER BY created_at ASC LIMIT 1;"
          COUNT="$(npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --json --command             "SELECT COUNT(*) AS count FROM control_sessions WHERE session_id_hash='$CATALOG_QA_SESSION_HASH';" | node --input-type=module -e '
              let raw=""; for await (const chunk of process.stdin) raw += chunk;
              const data=JSON.parse(raw); const rows=data?.[0]?.results ?? data?.[0]?.result ?? [];
              process.stdout.write(String(rows?.[0]?.count ?? 0));
            ')"
          if [[ "$COUNT" != "1" ]]; then
            echo "::error::Could not create the short-lived Production contract probe session."
            exit 1
          fi

      - name: Verify shared Boi device reads through the deployed Central bridge
        run: node scripts/production-release-control.mjs smoke-central

      - name: Reconcile managed app catalog before Production probe
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/application-management-catalog-sync.json --write-out '%{http_code}' --max-time 120 \
            -X POST \
            -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN" \
            -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Content-Type: application/json" \
            -H "Cookie: __Host-am_prod_session=$CATALOG_QA_SESSION_TOKEN" \
            --data '{"action":"sync-existing"}' \
            "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Production managed-app reconciliation failed with HTTP $CODE."
            cat /tmp/application-management-catalog-sync.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/application-management-catalog-sync.json", "utf8"));
          if (!value.ok) throw new Error(value.error || "Invalid Production catalog reconciliation response.");
          const all = [...(value.migrated ?? []), ...(value.existing ?? [])];

          const requireEnrolled = (id, label) => {
            const item = all.find((candidate) => candidate.id === id);
            const blocked = (value.needsOrigin ?? []).find((candidate) => candidate.id === id);
            if (blocked) throw new Error(`${label} was not enrolled: ${blocked.reason ?? "unknown"}`);
            if (!item) throw new Error(`${label} is missing from Production Dynamic Catalog reconciliation.`);
            console.log(`CATALOG ${id} enrolled source=${item.source ?? "existing"}`);
            return item;
          };

          requireEnrolled("software-blueprint-hub", "Software Blueprint Hub");
          requireEnrolled("cad-cam-3d", "CAD CAM 3D");
          console.log("CATALOG_SYNC_TOTALS=" + JSON.stringify(value.totals ?? {}));
          NODE

      - name: Probe managed app contracts after Production deploy
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/application-management-contract-probe.json --write-out '%{http_code}' --max-time 120             -X POST             -H "Origin: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN"             -H "Referer: $APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/tools/managed-apps"             -H "Sec-Fetch-Site: same-origin"             -H "Content-Type: application/json"             -H "Cookie: __Host-am_prod_session=$CATALOG_QA_SESSION_TOKEN"             --data '{"action":"probe-all"}'             "$APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN/api/managed-apps")"
          if [[ "$CODE" != "200" ]]; then
            echo "::error::Production managed-app probe failed with HTTP $CODE."
            cat /tmp/application-management-contract-probe.json || true
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/application-management-contract-probe.json", "utf8"));
          if (!value.ok || !Array.isArray(value.probes)) throw new Error(value.error || "Invalid Production contract probe response.");
          const blueprint = value.probes.find((item) => item.id === "software-blueprint-hub");
          if (!blueprint) throw new Error("Software Blueprint Hub is missing from the Production managed-app probe.");
          if (!blueprint.metadataVerified || blueprint.managementMode !== "metadata-only") {
            throw new Error("Software Blueprint Hub must be enrolled as verified metadata-only management.");
          }
          if (!blueprint.contractConnected || blueprint.runtimeConnected || blueprint.remoteAdminReady) {
            throw new Error("Software Blueprint Hub repository metadata must have a verified contract without live runtime or remote-admin readiness.");
          }

          const cad = value.probes.find((item) => item.id === "cad-cam-3d");
          if (!cad) throw new Error("CAD CAM 3D is missing from the Production managed-app probe.");
          if (!cad.contractConnected || !cad.runtimeConnected) {
            throw new Error("CAD CAM 3D must have both a live Universal Contract handshake and live Production runtime.");
          }
          if (cad.managementMode !== "local-first") {
            throw new Error(`CAD CAM 3D must remain local-first; received ${cad.managementMode ?? "unknown"}.`);
          }
          if (cad.remoteAdminReady || cad.credentialConfigured) {
            throw new Error("CAD CAM 3D must remain observe/launch-only until a real app-scoped Remote Admin backend exists.");
          }
          if (cad.protocol !== "application-management.contract/v1") {
            throw new Error(`CAD CAM 3D protocol mismatch: ${cad.protocol ?? "missing"}.`);
          }

          console.log("POST_DEPLOY_CONTRACT_TOTALS=" + JSON.stringify(value.totals ?? {}));
          for (const item of value.probes) {
            console.log(`CONTRACT ${item.id} connection=${item.connection} contractConnected=${Boolean(item.contractConnected)} credential=${Boolean(item.credentialConfigured)} remoteAdminReady=${Boolean(item.remoteAdminReady)} protocol=${item.protocol ?? "none"} via=${item.discoveredVia ?? "none"}`);
          }
          NODE

      - name: Upload sanitized post-deploy contract probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-management-production-contract-probe
          path: |
            /tmp/application-management-catalog-sync.json
            /tmp/application-management-contract-probe.json
          if-no-files-found: warn
          retention-days: 3

      - name: Delete short-lived owner contract probe session
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${CATALOG_QA_SESSION_HASH:-}" ]]; then
            npx wrangler d1 execute application-management-production-db --remote --config wrangler.production.jsonc --command               "DELETE FROM control_sessions WHERE session_id_hash='$CATALOG_QA_SESSION_HASH';"
          fi

      - name: Production deployment summary
        shell: bash
        run: |
          echo 'Application Management Production deployment completed.'
          echo 'Worker: application-management'
          echo 'D1: application-management-production-db'
          echo 'Access: existing production authentication and Worker secrets preserved.'
          echo 'Deployment remains manual-only.'
